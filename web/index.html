<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOWER · FlytBase GTM control tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens
   FlytBase brand system, edition 2026.04.
   One brand accent (Signal Orange). Green, red, amber and blue are FUNCTIONAL
   status only. Orange never signals status. Charcoal is the page, not a mode.
   Border radius is zero by default.                                        */
:root{
  --dbg:#1A1A1A; --ds:#1E1E1E; --de:#242424;
  --line:#2A2A2A; --line2:#2E2E2E; --line3:#262626; --lineStrong:#3D3D3D;
  --dsc:#999999; --dbd:#D6D6D6; --dh:#F0F0F0;
  --o200:#EC7D42; --o400:#D95B28; --o600:#A33D14; --o100:#F4B896;
  --euc:#72A899; --eucDim:#2B5A4A;
  --err:#F43F5E; --warn:#D9A441; --info:#3E6F9E;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{margin:0;padding:0}
*{box-sizing:border-box}
body{background:var(--dbg);color:var(--dbd);
  font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--o200);text-decoration:none}
a:hover{color:var(--o100)}
button{font-family:inherit}
::selection{background:var(--o400);color:#fff}
@keyframes tw-pulse{0%{box-shadow:0 0 0 0 rgba(114,168,153,.55)}70%{box-shadow:0 0 0 7px rgba(114,168,153,0)}100%{box-shadow:0 0 0 0 rgba(114,168,153,0)}}
@keyframes tw-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:tw-rise .5s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ------------------------------------------------------------------ shell */
.shell{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--dbg)}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:var(--dbg);border-right:1px solid var(--line);z-index:30}
.railhead{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;background:var(--o400);display:block}
.wordmark span.t{font:600 15px/1 Geist,sans-serif;letter-spacing:.24em;color:var(--dh)}
.railsub{font:400 10px/1.5 'Geist Mono',monospace;letter-spacing:.06em;color:var(--dsc);margin-top:9px}
.railnav{flex:1;display:flex;flex-direction:column;padding:18px 0;overflow-y:auto}
.navgroup{margin-bottom:20px}
.navlabel{font:500 9px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dsc);padding:0 20px 9px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
  border:0;border-left:2px solid transparent;padding:8px 20px 8px 18px;cursor:pointer;
  font:400 13.5px/1.3 Geist,sans-serif;color:var(--dsc);white-space:nowrap;
  transition:background 200ms var(--ease),color 200ms var(--ease)}
.navitem:hover{background:var(--de);color:var(--dh)}
.navitem .n{font:500 9px/1 'Geist Mono',monospace;letter-spacing:.06em;color:#5C5C5C}
.navitem.on{background:var(--de);color:var(--dh);border-left-color:var(--o400)}
.navitem.on .n{color:var(--o400)}
.railfoot{border-top:1px solid var(--line);padding:14px 20px}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--euc);display:block;animation:tw-pulse 2.6s infinite}
.canvas{min-width:0;background-image:
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:32px 32px}
header.vh{background:var(--dbg);border-bottom:1px solid var(--line);padding:26px 32px 22px}
.eyebrow{font:500 10px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--o400)}
h1.vt{font:500 28px/1.15 Lora,Georgia,serif;color:var(--dh);margin:11px 0 0;letter-spacing:-.005em}
p.vl{font:400 13.5px/1.6 Geist,sans-serif;color:var(--dsc);margin:10px 0 0;max-width:740px;text-wrap:pretty}
.pad{padding:24px 32px 80px}

/* -------------------------------------------------------------- primitives */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  border:1px solid var(--line2);background:var(--ds)}
.tile{padding:18px 20px 20px;border-right:1px solid var(--line)}
.tile:last-child{border-right:0}
.tlab{font:500 10px/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--dsc)}
.tval{font:500 31px/1.1 Geist,sans-serif;font-variant-numeric:tabular-nums;margin-top:12px;
  letter-spacing:-.015em;color:var(--dh)}
.tnote{font:400 12px/1.5 Geist,sans-serif;color:var(--dsc);margin-top:9px;text-wrap:pretty}
.banner{padding:14px 18px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start}
.banner .tag{font:500 9.5px/1.6 'Geist Mono',monospace;letter-spacing:.14em;white-space:nowrap}
.b-err{border:1px solid #6E1E30;border-left:3px solid var(--err);background:#241016}
.b-err .tag{color:var(--err)}
.b-warn{border:1px solid #4A3A16;border-left:3px solid var(--warn);background:#211B10}
.b-warn .tag{color:var(--warn)}
.b-ok{border:1px solid var(--eucDim);border-left:3px solid var(--euc);background:#12211C}
.b-ok .tag{color:var(--euc)}
.bh{font:500 14px/1.5 Geist,sans-serif;color:var(--dh)}
.bb{font:400 13px/1.6 Geist,sans-serif;color:var(--dbd);margin-top:6px;max-width:900px;text-wrap:pretty}
.bm{font:400 11px/1.6 'Geist Mono',monospace;color:var(--dsc);margin-top:8px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:38px 0 0;
  padding-bottom:10px;border-bottom:1px solid var(--line2)}
.sec h2{font:500 17px/1.2 Lora,Georgia,serif;color:var(--dh);margin:0}
.sec .cnt{font:400 10.5px/1 'Geist Mono',monospace;color:var(--dsc);letter-spacing:.08em}
.card{border:1px solid var(--line2);background:var(--ds)}
.cardhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;
  align-items:baseline;justify-content:space-between;gap:12px}
.cardhead .t{font:500 12.5px/1 Geist,sans-serif;color:var(--dh)}
.cardhead .m{font:400 10px/1 'Geist Mono',monospace;color:var(--dsc);letter-spacing:.08em}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px}
.pill{font:500 10px/1.5 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;display:inline-block;white-space:nowrap}
.q{border-left:1px solid var(--o600);padding:1px 0 1px 13px;margin:9px 0}
.q .txt{font:400 13px/1.55 Geist,sans-serif;color:var(--dbd);text-wrap:pretty}
.q .src{font:400 11px/1.5 'Geist Mono',monospace;color:var(--dsc);margin-top:4px;letter-spacing:.03em}
table{width:100%;border-collapse:collapse;font-family:Geist,sans-serif}
th{text-align:left;font:500 10px/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dsc);padding:14px 16px;border-bottom:1px solid var(--lineStrong);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line3);font:400 13.5px/1.45 Geist,sans-serif;
  color:var(--dbd);vertical-align:top}
tr.click{cursor:pointer;transition:background 200ms var(--ease)}
tr.click:hover td{background:var(--de)}
.num{text-align:right;font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:'Geist Mono',monospace}
.dim{color:var(--dsc)}
.sm{font-size:12.5px}
.xs{font:400 11px/1.5 'Geist Mono',monospace;color:var(--dsc)}
.back{background:transparent;border:1px solid var(--line2);color:var(--dsc);padding:7px 14px;
  cursor:pointer;font:400 11px/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:20px;transition:all 200ms var(--ease)}
.back:hover{border-color:var(--o400);color:var(--o200)}
.empty{padding:22px 18px;font:400 13px/1.6 Geist,sans-serif;color:var(--dsc)}
.bar{height:3px;background:var(--line);display:block}
.bar>i{display:block;height:3px}
.err{padding:80px 32px;text-align:center;color:var(--dsc);font:400 14px/1.7 Geist,sans-serif}
code{font-family:'Geist Mono',monospace;font-size:12px;color:var(--dbd)}

@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);
    min-width:0;max-width:100%;overflow:hidden}
  .railnav{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:0;padding:0;
    border-top:1px solid var(--line);min-width:0;max-width:100%;-webkit-overflow-scrolling:touch}
  .navgroup{margin:0;display:flex;align-items:center;border-right:1px solid var(--line);flex:0 0 auto}
  .navitem{white-space:nowrap;flex:0 0 auto}
  .navlabel{display:none}
  .railfoot{display:none}
  .pad,header.vh{padding-left:16px;padding-right:16px}
  .tile{border-right:0;border-bottom:1px solid var(--line)}
  .row2{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="railhead">
      <div class="wordmark"><span class="dot"></span><span class="t">TOWER</span></div>
      <div class="railsub">FlytBase GTM control tower</div>
    </div>
    <div class="railnav" id="nav"></div>
    <div class="railfoot">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="livedot"></span>
        <span class="mono" style="font-size:10.5px;color:var(--dsc);letter-spacing:.04em" id="syncLabel">connecting</span>
      </div>
      <div class="mono" style="font-size:10px;line-height:1.5;color:var(--dsc);margin-top:7px" id="syncStamp"></div>
    </div>
  </aside>
  <div class="canvas">
    <header class="vh">
      <div class="eyebrow" id="eyebrow">Loading</div>
      <h1 class="vt" id="vtitle">TOWER</h1>
      <p class="vl" id="vlede">Reading the latest portfolio state.</p>
    </header>
    <div class="pad" id="app"><div class="err">Loading portfolio…</div></div>
  </div>
</div>

<script>
/* =====================================================================
   TOWER dashboard.
   Contract with the engine, do not change:
     - fetches ./portfolio.json  and ./accounts/<account_id>.json
     - re-fetches every 30s and re-renders when generated_at changes
     - every key read below is produced by tower/portfolio.py
   ===================================================================== */

const $ = s => document.querySelector(s);
/* Last line of defence. When the reading layer is off, the pipeline writes a
   "[degraded mode: ...]" placeholder into fields it could not fill. The banner
   at the top of the page already says so in plain language, so the placeholder
   itself must never reach the screen anywhere. */
const esc = s => String(s ?? "")
  .replace(/\[degraded mode:[^\]]*\]/g, "not read yet")
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
const pct = n => n == null ? "—" : (n > 0 ? "+" : "") + n.toFixed(0) + "%";
/* Belief deltas store old/new as JSON, so a genuinely absent value arrives as
   the string "null". Show a dash, never the word null. */
const val = v => {
  if (v == null) return "—";
  const s = String(v).trim();
  return (s === "null" || s === "" || s === '""') ? "—" : s.replace(/^"|"$/g, "");
};

let PF = null, VIEW = "triage", ACC = null, CACHE = {};

/* Health bands map to functional status colours, never to the brand orange. */
const BAND = {
  "Strong":   {fg:"#8FD3BE", bg:"#12211C", bd:"#2B5A4A"},
  "Healthy":  {fg:"#72A899", bg:"#12211C", bd:"#1B3A30"},
  "Watch":    {fg:"#D9A441", bg:"#211B10", bd:"#4A3A16"},
  "At Risk":  {fg:"#F08497", bg:"#241016", bd:"#5A1F2C"},
  "Critical": {fg:"#F43F5E", bg:"#241016", bd:"#6E1E30"},
  "Secure":   {fg:"#8FD3BE", bg:"#12211C", bd:"#2B5A4A"},
  "Likely":   {fg:"#72A899", bg:"#12211C", bd:"#1B3A30"},
  "High Risk":{fg:"#F43F5E", bg:"#241016", bd:"#6E1E30"},
  "Lost":     {fg:"#F43F5E", bg:"#241016", bd:"#6E1E30"},
};
const band = b => BAND[b] || {fg:"#999999", bg:"#242424", bd:"#2E2E2E"};
const pillOf = (label) => {
  if (!label) return "";
  const c = band(label);
  return `<span class="pill" style="color:${c.fg};background:${c.bg};border:1px solid ${c.bd}">${esc(label)}</span>`;
};
const tagOf = (label) => label ? `<span class="pill" style="color:var(--dsc);background:var(--de);border:1px solid var(--line2)">${esc(label)}</span>` : "";

/* Plain-language labels. The engine's internal words are not user words. */
const TRAJ = {
  "collapsing":"collapsing", "declining":"falling", "dormant":"stopped flying",
  "flat":"flat", "growing":"growing", "scaling":"scaling fast",
  "recovered":"dipped then recovered", "no-data":"not flying yet",
  "insufficient-history":"too new to call"
};
const traj = t => TRAJ[t] || t || "—";
const LIFECYCLE = {
  "pre-sale":"Evaluating", "newly-sold-onboarding":"Onboarding",
  "established":"Established", "renewal-focused":"Renewal due", "churned":"Churned"
};
const stage = l => LIFECYCLE[l] || l || "—";

const VIEWS = [
  {group:"Act", items:[
    {k:"triage",   n:"01", label:"Do first",
     eyebrow:"Priority queue", title:"What to do first",
     lede:"Ranked by how much money is at stake against how much effort it takes. Every line names a person and expands to the sentence in the source document that justifies it."},
    {k:"gaps",     n:"02", label:"Reality Gap",
     eyebrow:"Label versus behaviour", title:"Where the CRM is wrong",
     lede:"Every account carries a health label. This checks that label against what the account actually does. A red row means the record is more optimistic than the evidence supports."},
  ]},
  {group:"Money", items:[
    {k:"renewals", n:"03", label:"Renewals",
     eyebrow:"Revenue at risk", title:"What we actually keep",
     lede:"Each renewal is weighted by a probability built from computed health and named adjustments. It is deliberately lower than the number you get by trusting the labels."},
    {k:"expansion",n:"04", label:"Expansion & Traps",
     eyebrow:"Qualified growth", title:"Where we can sell more",
     lede:"A customer saying they will grow is not pipeline. Anything that fails qualification is filed as a Trap, with the blocker named and the condition that would unblock it."},
    {k:"winback",  n:"05", label:"Win-back",
     eyebrow:"Churned accounts", title:"Who is worth chasing",
     lede:"Not every lost customer is worth the effort. Scored on whether the reason they left is something FlytBase can now change, and whether anyone there would still take the call."},
  ]},
  {group:"Evidence", items:[
    {k:"accounts", n:"06", label:"All accounts",
     eyebrow:"Portfolio", title:"Every account",
     lede:"Health here is worked out from behaviour, not copied from the record. The CRM column sits next to it so you can see where the two disagree."},
    {k:"flight",   n:"07", label:"Flight activity",
     eyebrow:"Usage truth", title:"Who is actually flying",
     lede:"Flight hours by month, straight from usage history. The last column answers the question directly: does the trend agree with the label?"},
    {k:"contra",   n:"08", label:"Contradictions",
     eyebrow:"Disagreeing sources", title:"Where the sources disagree",
     lede:"Some of this data does not agree with itself. Rather than quietly picking a winner, both claims are kept and resolved by a fixed rule: what a customer said, dated, beats an internal note, which beats the CRM."},
  ]},
  {group:"System", items:[
    {k:"feed",     n:"09", label:"Change feed",
     eyebrow:"Self-update log", title:"What changed, and when",
     lede:"A complete inventory of the source is taken every cycle and every document is fingerprinted. That is the only way to notice something that stopped being available. Withdrawn documents are kept for the record and dropped from the reasoning."},
  ]}
];
const flatViews = VIEWS.flatMap(g => g.items);
const viewMeta = k => flatViews.find(v => v.k === k) || flatViews[0];

/* ------------------------------------------------------------------ boot */
async function boot(){
  try {
    PF = await (await fetch("portfolio.json?t=" + Date.now())).json();
  } catch (e) {
    $("#app").innerHTML = `<div class="err">Could not load <code>portfolio.json</code>.<br><br>
      The system has not published state yet. This page checks again every 30 seconds.</div>`;
    return;
  }
  renderNav(); render(); tickLive();
}
function renderNav(){
  $("#nav").innerHTML = VIEWS.map(g => `
    <div class="navgroup">
      <div class="navlabel">${esc(g.group)}</div>
      ${g.items.map(it => `<button class="navitem${it.k===VIEW?" on":""}" onclick="go('${it.k}')">
        <span class="n">${it.n}</span><span>${esc(it.label)}</span></button>`).join("")}
    </div>`).join("");
}
window.go = k => { VIEW = k; ACC = null; renderNav(); render(); window.scrollTo(0,0); };
window.open_acc = id => { ACC = id; render(); window.scrollTo(0,0); };

function tickLive(){
  const s = PF?.system?.last_sync;
  const stamp = (PF?.generated_at || "").replace("T"," ").replace("+00:00","");
  $("#syncLabel").textContent = s ? `sync ${s.id} · live` : "no sync yet";
  $("#syncStamp").textContent = stamp ? stamp + " UTC" : "";
}
setInterval(async () => {
  try {
    const fresh = await (await fetch("portfolio.json?t=" + Date.now())).json();
    if (fresh.generated_at !== PF?.generated_at) { PF = fresh; CACHE = {}; render(); tickLive(); }
  } catch (e) {}
}, 30000);

function setHead(eyebrow, title, lede){
  $("#eyebrow").textContent = eyebrow;
  $("#vtitle").textContent = title;
  $("#vlede").textContent = lede;
}

function render(){
  if (ACC) return renderAccount(ACC);
  const m = viewMeta(VIEW);
  setHead(m.eyebrow, m.title, m.lede);
  const fn = {triage:vTriage, accounts:vAccounts, renewals:vRenewals, expansion:vExpansion,
              gaps:vGaps, contra:vContra, winback:vWinback, flight:vFlight, feed:vFeed}[VIEW];
  $("#app").innerHTML = `<div class="rise">${fn ? fn() : ""}</div>`;
}

/* --------------------------------------------------------------- helpers */
function degradedBanner(){
  const r = PF.reading || {};
  const anyDeg = (PF.accounts || []).some(a => a.degraded);
  if (!anyDeg && r.enabled !== false) return "";
  const why = r.last_error ? `Provider ${esc(r.provider || "none")}. Last error: ${esc(String(r.last_error).slice(0,160))}`
                           : "No document-reading model is configured.";
  return `<div class="banner b-err">
    <span class="tag">DEGRADED</span>
    <div>
      <div class="bh">This page is incomplete. The part that reads documents is not running.</div>
      <div class="bb">Everything shown is still true. Account health, usage, the Reality Gap and the ranking
        are all calculated directly from the data and do not need a model. What is missing is anything read
        out of a document: people, risks, opportunities, Traps and recommended actions.</div>
      <div class="bm">${why}</div>
    </div></div>`;
}
/* -------------------------------------------------------- flight charts */
/* Numbers are printed on the chart on purpose. A line alone tells you the
   shape but not the size, and the size is what you say out loud in a review. */
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const num1 = v => v == null ? "—" : String(Math.round(v * 10) / 10);
function mlabel(m){                                    /* "2026-01" -> "Jan 26" */
  const p = String(m ?? "").split("-");
  if (p.length < 2) return String(m ?? "");
  return (MON3[parseInt(p[1],10) - 1] || p[1]) + " " + p[0].slice(2);
}
function momPct(vals, i){                    /* change against the month before */
  if (i < 1) return null;
  const prev = vals[i-1];
  if (prev == null || prev === 0) return null;
  return Math.round((vals[i] - prev) / prev * 100);
}
const momCol = c => c == null ? "var(--dsc)" : c < 0 ? "var(--err)" : c > 0 ? "var(--euc)" : "var(--dsc)";

/* small line for table cells */
function spark(vals, w = 108, h = 26){
  if (!vals || vals.length < 2) return "";
  const mx = Math.max(...vals, 1), mn = Math.min(...vals, 0), rng = (mx - mn) || 1;
  const pts = vals.map((v,i) => [i/(vals.length-1)*w, h - ((v-mn)/rng)*(h-4) - 2]);
  const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const up = vals[vals.length-1] >= vals[0];
  const col = up ? "#72A899" : "#F43F5E";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.3"/>
    ${pts.map((p,i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}"
      r="${i === pts.length-1 ? 2.6 : 1.5}" fill="${col}"/>`).join("")}</svg>`;
}

/* the actual monthly numbers, under the small line, for reading aloud */
function sparkNums(vals, months){
  if (!vals || !vals.length) return "";
  const cells = vals.map((v,i) => {
    const c = momPct(vals, i);
    const last = i === vals.length - 1;
    return `<span style="color:${last ? "var(--dh)" : momCol(c)};${last ? "font-weight:700" : ""}">${num1(v)}</span>`;
  }).join(`<span style="color:var(--lineStrong)">›</span>`);
  const range = (months && months.length)
    ? `<div style="font:400 9.5px/1.4 Geist,sans-serif;color:var(--dsc);margin-top:3px">
         ${esc(mlabel(months[0]))} to ${esc(mlabel(months[months.length-1]))} · flight hours</div>` : "";
  return `<div style="display:flex;gap:4px;align-items:baseline;margin-top:5px;
    font:500 10.5px/1 'Geist Mono',monospace">${cells}</div>${range}`;
}

/* big labelled chart for the account page: value above each dot, month and
   month-on-month change below it */
let CHART_N = 0;
function chartBig(vals, months, unitLabel){
  if (!vals || vals.length < 2) return "";
  const n = vals.length, step = 78, padX = 56, padTop = 34, plotH = 108, padBot = 68;
  const W = padX * 2 + step * (n - 1), H = padTop + plotH + padBot;
  const mx = Math.max(...vals), mn = Math.min(...vals, 0), rng = (mx - mn) || 1;
  const X = i => padX + step * i;
  const Y = v => padTop + plotH - ((v - mn) / rng) * plotH;
  const pts = vals.map((v,i) => [X(i), Y(v)]);
  const line = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const base = padTop + plotH;
  const area = `${line} L${X(n-1).toFixed(1)},${base} L${padX},${base} Z`;
  const col = vals[n-1] < vals[0] ? "#F43F5E" : "#72A899";
  const peak = Math.max(...vals), peakY = Y(peak);
  const gid = "twgrad" + (++CHART_N);
  const marks = pts.map((p,i) => {
    const c = momPct(vals, i), last = i === n - 1;
    const cc = c == null ? "#999999" : c < 0 ? "#F43F5E" : c > 0 ? "#72A899" : "#999999";
    const ct = c == null ? "" : (c > 0 ? "+" : "") + c + "%";
    return `
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last ? 4.5 : 3.2}"
        fill="${last ? col : "#1A1A1A"}" stroke="${col}" stroke-width="1.8"/>
      <text x="${p[0].toFixed(1)}" y="${(p[1] - 14).toFixed(1)}" text-anchor="middle"
        fill="${last ? "#F0F0F0" : "#D6D6D6"}"
        style="font:${last ? 700 : 500} 15px 'Geist Mono',monospace">${num1(vals[i])}</text>
      <text x="${p[0].toFixed(1)}" y="${base + 22}" text-anchor="middle" fill="#999999"
        style="font:400 12px Geist,sans-serif">${esc(mlabel(months && months[i]))}</text>
      <text x="${p[0].toFixed(1)}" y="${base + 39}" text-anchor="middle" fill="${cc}"
        style="font:500 12px 'Geist Mono',monospace">${ct}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
      style="display:block;width:100%;height:auto">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".24"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${padX - 22}" y1="${peakY.toFixed(1)}" x2="${W - padX + 22}" y2="${peakY.toFixed(1)}"
      stroke="#3D3D3D" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="${padX - 24}" y="${(peakY + 4).toFixed(1)}" text-anchor="end" fill="#7A7A7A"
      style="font:400 11px 'Geist Mono',monospace">${num1(peak)}</text>
    <line x1="${padX - 22}" y1="${base}" x2="${W - padX + 22}" y2="${base}"
      stroke="#3D3D3D" stroke-width="1"/>
    <text x="${padX - 24}" y="${base + 4}" text-anchor="end" fill="#7A7A7A"
      style="font:400 11px 'Geist Mono',monospace">${num1(mn)}</text>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.2"/>
    ${marks}
    <text x="${padX - 32}" y="${H - 6}" fill="#7A7A7A"
      style="font:400 11px Geist,sans-serif">${esc(unitLabel || "flight hours per month")} · the % under each month is the change from the month before</text>
  </svg>`;
}
function quotes(list, srcLabel){
  if (!list || !list.length) return "";
  return list.slice(0,3).map(q => `<div class="q"><div class="txt">${esc(q)}</div>${
    srcLabel ? `<div class="src">${esc(srcLabel)}</div>` : ""}</div>`).join("");
}

        </div>
        <div style="padding:18px">
          <div class="xs" style="letter-spacing:.14em;text-transform:uppercase">The call</div>
          <div style="font:400 13.5px/1.6 Geist,sans-serif;color:var(--dbd);margin-top:9px">${esc(x.reasoning||"—")}</div>
          ${x.residual_relationship ? `<div class="xs" style="letter-spacing:.14em;text-transform:uppercase;margin-top:16px">Who would still pick up</div>
            <div style="font:400 13.5px/1.6 Geist,sans-serif;color:var(--dbd);margin-top:7px">${esc(x.residual_relationship)}</div>` : ""}
          ${x.first_move ? `<div class="xs" style="letter-spacing:.14em;text-transform:uppercase;margin-top:16px">First move</div>
            <div style="font:400 13.5px/1.6 Geist,sans-serif;color:var(--o200);margin-top:7px">${esc(x.first_move)}</div>` : ""}
        </div>

      <div style="padding:12px 18px;border-top:1px solid var(--line3)">
        <a href="#" onclick="open_acc('${esc(x.account_id)}');return false">Open the full account →</a></div>

  }).join("");
}

/* ---------------------------------------------------------------- flight */
function vFlight(){
  const rows = PF.flight_activity || [];
  const disagree = rows.filter(f => !f.agrees_with_label).length;
  return `
  ${disagree ? `<div class="banner b-warn"><span class="tag">${disagree} DISAGREE</span>
    <div><div class="bh">${disagree} accounts are flying in a way their health label does not reflect.</div>
    <div class="bb">Flight hours are the least deniable signal in this dataset. A customer can say anything on a
      call. What they actually fly is what they actually do.</div></div></div>` : ""}
  <div class="card" style="overflow-x:auto"><table>
    <thead><tr><th>Account</th><th class="num">ARR</th><th>Flight hours, month by month</th><th>Trend</th>
      <th class="num">Last 3 vs prior 3</th><th class="num">Latest</th><th class="num">Best ever</th>
      <th>Record says</th><th>Agrees?</th></tr></thead>
    <tbody>${rows.map(f => `
      <tr class="click" onclick="open_acc('${esc(f.account_id)}')">
        <td><span style="color:var(--dh)">${esc(f.name)}</span></td>
        <td class="num">${money(f.arr)}</td>
        <td style="min-width:190px">${spark(f.values, 168, 30)}${sparkNums(f.values, f.months)}</td>
        <td>${tagOf(traj(f.trajectory))}</td>
        <td class="num" style="color:${(f.pct_3v3||0) < 0 ? "var(--err)" : "var(--euc)"}">${pct(f.pct_3v3)}</td>
        <td class="num">${num1(f.latest)}</td>
        <td class="num dim">${num1(f.peak)}</td>
        <td class="dim">${esc(f.crm_health||"—")}</td>
        <td>${f.agrees_with_label ? `<span style="color:var(--euc)">yes</span>`
                                  : `<span style="color:var(--err)">no</span>`}</td>
      </tr>`).join("")}</tbody></table>
    <div class="empty" style="border-top:1px solid var(--line3)">Accounts with no flight history are left out.
      For an account still evaluating, that is expected and not a warning sign.</div></div>`;
}

/* ------------------------------------------------------------------ feed */
function vFeed(){
  const sys = PF.system || {}, wd = sys.withdrawn_objects || [];
  const cf = PF.change_feed || [], syncs = PF.syncs || [];
  const CT = {ADDED:{c:"var(--euc)",l:"ARRIVED"}, MODIFIED:{c:"var(--warn)",l:"CHANGED"},
              WITHDRAWN:{c:"var(--err)",l:"TAKEN AWAY"}, RESTORED:{c:"var(--o200)",l:"CAME BACK"}};
  return `
  <div class="tiles">
    <div class="tile"><div class="tlab">Times it checked</div><div class="tval">${syncs.length}</div>
      <div class="tnote">every 60 seconds, nobody pressing anything</div></div>
    <div class="tile"><div class="tlab">Documents taken away</div>
      <div class="tval" style="color:${wd.length ? "var(--err)" : "var(--dsc)"}">${wd.length}</div>
      <div class="tnote">spotted by re-checking everything, not by asking what is new</div></div>
    <div class="tile"><div class="tlab">Times it changed its mind</div><div class="tval">${(PF.belief_deltas||[]).length}</div>
      <div class="tnote">each traced to the document that caused it</div></div>
    <div class="tile"><div class="tlab">Checking every</div><div class="tval">60s</div>
      <div class="tnote">runs on GitHub, not on anyone's laptop</div></div>
  </div>

  ${wd.length ? `<div class="sec"><h2>Documents that disappeared</h2><span class="cnt">${wd.length}</span></div>
  <div class="card">${wd.map(w => `
    <div style="padding:14px 18px;border-bottom:1px solid var(--line3);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap">
      <span class="pill" style="color:var(--err);background:#241016;border:1px solid #6E1E30">TAKEN AWAY</span>
      <span class="mono" style="font-size:12.5px;color:var(--dbd)">${esc(w.obj_key)}</span>
      <span class="xs">${esc(w.account_id || "portfolio wide")} · ${esc((w.withdrawn_at||"").replace("T"," ").replace("+00:00",""))} UTC</span>
    </div>`).join("")}
    <div class="empty" style="border-top:1px solid var(--line3)">These are kept on record but no longer used to
      draw conclusions. If a claim rested only on one of these, that claim has been withdrawn too.</div></div>` : ""}

  ${(PF.belief_deltas||[]).length ? `<div class="sec"><h2>Where it changed its mind</h2></div>
  <div class="card">${PF.belief_deltas.slice(0,25).map(d => `
    <div style="padding:14px 18px;border-bottom:1px solid var(--line3)">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <span class="xs">${esc((d.occurred_at||"").replace("T"," ").replace("+00:00",""))}</span>
        <span style="font:500 13.5px/1.4 Geist,sans-serif;color:var(--dh)">${esc(d.account_id)}</span>
        <span class="mono sm dim">${esc(d.field)}</span>
        <span class="mono sm">${esc(val(d.old_value))} → <b style="color:var(--dh)">${esc(val(d.new_value))}</b></span></div>
      ${d.narrative ? `<div style="font:400 13px/1.6 Geist,sans-serif;color:var(--dbd);margin-top:6px">${esc(d.narrative)}</div>` : ""}
    </div>`).join("")}</div>` : ""}

  <div class="sec"><h2>Everything it noticed</h2><span class="cnt">${cf.length} EVENTS</span></div>
  <div class="card">${cf.slice(0,60).map(c => {
    const t = CT[c.change_type] || {c:"var(--dsc)", l:c.change_type};
    return `<div style="padding:12px 18px;border-bottom:1px solid var(--line3);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap">
      <span class="mono" style="font-size:9.5px;letter-spacing:.14em;color:${t.c};min-width:88px">${t.l}</span>
      <span class="xs" style="min-width:132px">${esc((c.detected_at||"").replace("T"," ").replace("+00:00",""))}</span>
      <span style="font:400 13px/1.5 Geist,sans-serif;color:var(--dbd);flex:1;min-width:200px">
        ${esc(c.title || c.source_id)}${c.account_id ? ` <span class="xs">· ${esc(c.account_id)}</span>` : ""}</span>
    </div>`;
  }).join("")}</div>

  <div class="sec"><h2>Every check it ran</h2></div>
  <div class="card" style="overflow-x:auto"><table>
    <thead><tr><th>Run</th><th>Started</th><th>Started by</th><th class="num">Documents seen</th>
      <th class="num">New</th><th class="num">Changed</th><th class="num">Taken away</th>
      <th class="num">Accounts redone</th><th>Result</th></tr></thead>
    <tbody>${syncs.map(s => `
      <tr><td class="mono dim">${s.id}</td>
        <td class="xs">${esc((s.started_at||"").replace("T"," ").replace("+00:00",""))}</td>
        <td>${tagOf(s.trigger)}</td>
        <td class="num">${s.objects_seen}</td>
        <td class="num" style="color:${s.added?"var(--euc)":"inherit"}">${s.added}</td>
        <td class="num">${s.modified}</td>
        <td class="num" style="color:${s.withdrawn?"var(--err)":"inherit"}">${s.withdrawn}</td>
        <td class="num">${s.accounts_resynth}</td>
        <td>${s.status === "ok" ? `<span style="color:var(--euc)">ok</span>`
                                : `<span style="color:var(--err)">${esc(s.status)}</span>`}</td></tr>`).join("")}
    </tbody></table></div>`;
}

/* -------------------------------------------------------- account detail */
async function renderAccount(id){
  if (!CACHE[id]) {
    try { CACHE[id] = await (await fetch(`accounts/${id}.json?t=` + Date.now())).json(); }
    catch (e) {
      setHead("Account", id, "");
      $("#app").innerHTML = `<button class="back" onclick="go('${VIEW}')">← back</button>
        <div class="err">No detail published for ${esc(id)} yet.</div>`;
      return;
    }
  }
  const s = CACHE[id], u = s.usage.flightHours, g = s.reality_gap, sy = s.synthesis || {};
  /* When the reading layer is down the engine writes an internal placeholder
     into one_line. Never show engineering text as a headline. */
  const rawLine = sy.one_line || "";
  const headline = (!rawLine || rawLine.startsWith("[degraded"))
    ? `${stage(s.lifecycle)} · ${money(s.arr)} a year · flying ${traj(u.trajectory)}. Everything below is calculated from this account's own behaviour.`
    : rawLine;
  setHead(stage(s.lifecycle), s.name, headline);

  const gapBanner = g.direction === "overstated"
    ? `<div class="banner b-warn"><span class="tag">REALITY GAP</span><div>
        <div class="bh">The record says ${esc(g.stated)}. The behaviour says ${esc(g.derived)}.</div>
        <div class="bb">${esc(g.note)}</div></div></div>`
    : g.direction === "aligned"
    ? `<div class="banner b-ok"><span class="tag">AGREES</span><div class="bh">${esc(g.note)}</div></div>`
    : `<div class="banner b-warn" style="opacity:.8"><span class="tag">NO LABEL</span><div class="bh">${esc(g.note)}</div></div>`;

  $("#app").innerHTML = `<div class="rise">
  <button class="back" onclick="go('${VIEW}')">← back to ${esc(viewMeta(VIEW).label)}</button>
  <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:18px">
    ${pillOf(s.health.band)} <span class="mono" style="color:var(--dsc);font-size:12px">health ${s.health.score}</span>
    ${tagOf(money(s.arr) + " ARR")} ${s.tier ? tagOf(s.tier) : ""}
    ${s.cs_owner && s.cs_owner !== "—" ? tagOf("CS " + s.cs_owner) : ""}
    ${s.se_owner && s.se_owner !== "—" ? tagOf("SE " + s.se_owner) : ""}
  </div>
  ${gapBanner}

  <div class="row2">
    <div class="card">
      <div class="cardhead"><span class="t">Why this health score</span><span class="m">FIVE FACTORS</span></div>
      ${(s.health.factors||[]).map(f => `
        <div style="padding:13px 18px;border-bottom:1px solid var(--line3)">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
            <span style="font:500 13px/1.4 Geist,sans-serif;color:var(--dh)">${esc(f.factor.replace(/_/g," "))}</span>
            <span class="mono sm" style="color:${f.points_lost > 8 ? "var(--err)" : "var(--dsc)"}">−${f.points_lost} of ${f.weight}</span></div>
          <div style="font:400 12.5px/1.55 Geist,sans-serif;color:var(--dsc);margin-top:5px">${esc(f.reason)}</div>
          <span class="bar" style="margin-top:8px"><i style="width:${(f.quality*100).toFixed(0)}%;
            background:${f.quality > .7 ? "var(--euc)" : f.quality > .45 ? "var(--warn)" : "var(--err)"}"></i></span>
        </div>`).join("")}
      <div class="empty">Every point lost is attributable to a named factor with a stated reason. Disagree with
        the weighting and you can argue with it, which is the point.</div>
    </div>

    <div class="card">
      <div class="cardhead"><span class="t">Flight activity</span>${s.usage.has_usage
        ? `<span class="m">${esc(mlabel(u.months[0]))} → ${esc(mlabel(u.months[u.months.length-1]))}</span>` : ""}</div>
      ${s.usage.has_usage ? `
        <div style="padding:20px 18px 6px;overflow-x:auto">${chartBig(u.values, u.months, "flight hours per month")}</div>
        <div style="padding:6px 18px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:stretch">
          <div style="flex:1 1 120px;min-width:110px">
            <div class="tval" style="font-size:24px;margin:0">${num1(u.latest)}</div>
            <div class="tnote" style="margin-top:4px">flight hours in ${esc(mlabel(u.months[u.months.length-1]))}</div></div>
          <div style="flex:1 1 120px;min-width:110px">
            <div class="tval" style="font-size:24px;margin:0;color:${(u.pct_3v3||0) < 0 ? "var(--err)" : "var(--euc)"}">${pct(u.pct_3v3)}</div>
            <div class="tnote" style="margin-top:4px">last three months against the three before</div></div>
          <div style="flex:1 1 120px;min-width:110px">
            <div class="tval" style="font-size:24px;margin:0;color:${(u.pct_last_vs_peak||0) < 0 ? "var(--err)" : "var(--euc)"}">${pct(u.pct_last_vs_peak)}</div>
            <div class="tnote" style="margin-top:4px">against its best month, ${num1(u.peak)} in ${esc(mlabel(u.peak_month))}</div></div>

        <div style="padding:0 18px 16px">
          <div style="font:400 13.5px/1.6 Geist,sans-serif;color:var(--dbd)">${esc(u.headline)}</div>

      <div class="cardhead" style="border-top:1px solid var(--line3)"><span class="t">Renewal</span></div>
      ${s.renewal.date ? `<div style="padding:16px 18px">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <span class="mono" style="font-size:15px;color:var(--dh)">${esc(s.renewal.date)}</span>
            <span class="xs">${s.renewal.days_to_renewal} days away</span>
            ${pillOf(s.renewal.bucket)}
            ${s.renewal.probability != null ? `<span class="xs">${(s.renewal.probability*100).toFixed(0)}% chance it lands</span>` : ""}

          <div class="xs" style="margin-top:9px">${esc(s.renewal.basis || "")}</div>
          ${s.renewal.source ? `<div class="q"><div class="txt">${esc(s.renewal.source.quote||"")}</div>
            <div class="src">${esc(s.renewal.source.doc||"")}</div></div>` : ""}
        </div>` : `<div class="empty">No renewal or contract date is stated anywhere in the source material.</div>`}
    </div>
  </div>

  ${sy.situation && !sy.situation.startsWith("No model key") ? `<div class="sec"><h2>What is going on</h2></div>
  <div class="card"><div style="padding:18px">
    <div style="font:400 14.5px/1.65 Geist,sans-serif;color:var(--dbd);text-wrap:pretty">${esc(sy.situation)}</div>
    <div class="xs" style="margin-top:12px">
      mood ${esc(sy.sentiment_label||"—")} and ${esc(sy.sentiment_trend||"—")} ·
      champion ${esc(sy.champion_status||"—")} ·
      ${sy.economic_buyer_identified ? "we know who signs" : `<span style="color:var(--err)">nobody identified who signs</span>`}
      ${sy.competitor_present ? ` · <span style="color:var(--err)">competitor in the account</span>` : ""}
      ${s.days_silent != null ? ` · last contact ${s.days_silent} days ago` : ""}
    </div></div></div>` : ""}

  ${(s.actions||[]).length ? `<div class="sec"><h2>Do this next</h2><span class="cnt">${s.actions.length}</span></div>
  <div class="card">${s.actions.map((a,i) => `
    <div style="padding:18px;border-bottom:1px solid var(--line3);display:grid;grid-template-columns:44px 1fr;gap:0">

      <div><div style="font:500 14.5px/1.5 Geist,sans-serif;color:var(--dh)">${esc(a.action)}</div>

        ${a.why_now ? `<div style="font:400 13px/1.6 Geist,sans-serif;color:var(--dsc);margin-top:7px">${esc(a.why_now)}</div>` : ""}
        ${quotes(a.evidence_quotes, "from the source document")}</div>
    </div>`).join("")}</div>` : ""}

  ${(sy.top_risks||[]).length || (sy.opportunities||[]).length ? `<div class="row2" style="margin-top:22px">
    <div class="card"><div class="cardhead"><span class="t">What could go wrong</span></div>
      ${(sy.top_risks||[]).length ? sy.top_risks.map(r => `
        <div style="padding:16px 18px;border-bottom:1px solid var(--line3)">
          <div style="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap">
            ${pillOf(r.severity === "critical" ? "Critical" : r.severity === "high" ? "At Risk" : "Watch")}

          <div style="font:400 13px/1.6 Geist,sans-serif;color:var(--dsc);margin-top:6px">${esc(r.why_it_matters||"")}</div>
          ${quotes(r.evidence_quotes)}
        </div>`).join("") : `<div class="empty">Nothing material surfaced.</div>`}</div>
    <div class="card"><div class="cardhead"><span class="t">Where we could grow</span></div>
      ${(sy.opportunities||[]).length ? sy.opportunities.map(o => `

          ${o.unblock_condition ? `<div style="font:400 13px/1.6 Geist,sans-serif;color:var(--o200);margin-top:6px">Chase it once: ${esc(o.unblock_condition)}</div>` : ""}
          ${quotes(o.evidence_quotes)}
        </div>`).join("") : `<div class="empty">No growth signals in the evidence.</div>`}</div>
  </div>` : ""}

  ${(s.people||[]).length ? `<div class="sec"><h2>Who matters here</h2><span class="cnt">${s.people.length} PEOPLE</span></div>

  ${(s.open_commitments||[]).length ? `<div class="sec"><h2>Promises nobody closed</h2></div>

    <div style="padding:14px 18px;border-bottom:1px solid var(--line3)">

        ${tagOf(c.owner_side === "flytbase" ? "we promised" : "they promised")}
        <span style="font:400 13.5px/1.5 Geist,sans-serif;color:var(--dbd)">${esc(c.promise)}</span></div>
      ${c.quote ? `<div class="q"><div class="txt">${esc(c.quote)}</div><div class="src">${esc(c.doc||"")}${c.due ? " · due " + esc(c.due) : ""}</div></div>` : ""}
    </div>`).join("")}</div>` : ""}

  <div class="sec"><h2>Where all of this came from</h2><span class="cnt">${(s.documents||[]).length} DOCUMENTS</span></div>
  <div class="card" style="overflow-x:auto"><table>
    <thead><tr><th>Document</th><th>Type</th><th>Dated</th><th>How we know the date</th><th>What it says</th></tr></thead>
    <tbody>${(s.documents||[]).map(d => `<tr>
      <td><span style="color:var(--dh)">${esc(d.title)}</span><div class="xs">${esc(d.file)}</div></td>
      <td>${tagOf(d.type)}</td>
      <td class="mono sm dim">${esc(d.date || "undated")}</td>
      <td class="xs">${esc(d.date_basis)}${d.date_text ? ` · "${esc(d.date_text)}"` : ""}</td>
      <td class="dim sm">${(!d.summary || d.summary.startsWith("[degraded"))
        ? `<span style="color:var(--dsc)">Held and fingerprinted. Not summarised, because the reading layer is not running.</span>`
        : esc(d.summary)}</td></tr>`).join("")}</tbody></table>
    <div class="empty" style="border-top:1px solid var(--line3)">${s._evidence_count || 0} quotable passages indexed
      for this account. Anything withdrawn from the source is excluded here and listed on the change feed.</div></div>

  ${(s._deltas||[]).length ? `<div class="sec"><h2>How our view of this account has moved</h2></div>
  <div class="card">${s._deltas.slice(0,12).map(d => `
    <div style="padding:13px 18px;border-bottom:1px solid var(--line3)">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <span class="xs">${esc((d.occurred_at||"").replace("T"," ").replace("+00:00",""))}</span>
        <span class="mono sm dim">${esc(d.field)}</span>
        <span class="mono sm">${esc(val(d.old_value))} → <b style="color:var(--dh)">${esc(val(d.new_value))}</b></span></div>
      ${d.narrative ? `<div style="font:400 13px/1.6 Geist,sans-serif;color:var(--dbd);margin-top:6px">${esc(d.narrative)}</div>` : ""}
    </div>`).join("")}</div>` : ""}
  </div>`;
}

boot();
</script>
</body>
</html>
