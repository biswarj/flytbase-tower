<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOWER · FlytBase GTM control tower</title>
<meta name="description" content="Always-on GTM control tower for the FlytBase Book of Business.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens
   FlytBase brand system, edition 2026.04. One brand accent (Signal Orange).
   Green / red / amber / blue are functional status only. Radius is zero. */
:root{
  --bg:#1A1A1A; --surf:#1E1E1E; --surf2:#232323; --el:#242424;
  --bd:#2E2E2E; --bd2:#2A2A2A; --bd3:#262626; --bd4:#3D3D3D;
  --tx:#D6D6D6; --hd:#F0F0F0; --sc:#999999;
  --o:#D95B28; --o2:#EC7D42; --o3:#A33D14; --o4:#F4B896;
  --ok:#3A7A65; --ok2:#72A899; --ok3:#8FC9B4; --okbd:#2B5A4A; --okbg:#16211D;
  --warn:#D9A441; --warn2:#E0B45C; --warnbd:#4A3A16; --warnbg:#231E11;
  --err:#F43F5E; --err2:#F0768D; --errbd:#6E1E30; --errbg:#2C1017;
  --sans:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:Lora,Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--o2);text-decoration:none}
a:hover{color:var(--o4)}
button{font-family:inherit}
::selection{background:var(--o);color:#fff}
@keyframes tw-pulse{0%{box-shadow:0 0 0 0 rgba(114,168,153,.55)}
  70%{box-shadow:0 0 0 7px rgba(114,168,153,0)}100%{box-shadow:0 0 0 0 rgba(114,168,153,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* -------------------------------------------------------------------- shell */
.shell{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--bg)}
.rail{position:sticky;top:0;height:100vh;min-width:0;display:flex;flex-direction:column;
  background:var(--bg);border-right:1px solid var(--bd2);z-index:30}
.rail-top{padding:22px 20px 18px;border-bottom:1px solid var(--bd2)}
.mark{display:flex;align-items:center;gap:9px}
.mark-dot{width:7px;height:7px;background:var(--o);display:block;flex:none}
.wordmark{font:600 15px/1 var(--sans);letter-spacing:.24em;color:var(--hd)}
.rail-sub{font:400 10px/1.5 var(--mono);letter-spacing:.06em;color:var(--sc);margin-top:9px}
.railnav{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px 0;overflow-y:auto}
.navgroup{margin-bottom:20px}
.navlabel{font:500 9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--sc);padding:0 20px 9px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
  border:0;border-left:2px solid transparent;padding:8px 20px 8px 18px;cursor:pointer;
  font:400 13.5px/1.3 var(--sans);color:var(--sc);white-space:nowrap;
  transition:background 200ms var(--ease),color 200ms var(--ease)}
.navbtn:hover{background:var(--el);color:var(--hd)}
.navbtn .n{font:500 9px/1 var(--mono);color:var(--sc);letter-spacing:.06em}
.navbtn.on{background:var(--el);color:var(--hd);border-left-color:var(--o)}
.navbtn.on .n{color:var(--o)}
.navbtn:focus-visible{outline:1px solid var(--o2);outline-offset:-1px}
.railfoot{border-top:1px solid var(--bd2);padding:14px 20px}
.livewrap{display:flex;align-items:center;gap:8px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--ok2);display:block;flex:none;
  animation:tw-pulse 2.6s infinite}
.live-dot.off{background:var(--err);animation:none}
.live-txt{font:400 10.5px/1 var(--mono);color:var(--sc);letter-spacing:.04em}
.live-stamp{font:400 10px/1.5 var(--mono);color:var(--sc);margin-top:7px}

.content{min-width:0;background-image:
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:32px 32px}
.vhead{background:var(--bg);border-bottom:1px solid var(--bd2);padding:26px 32px 22px}
.eyebrow{font:500 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--o)}
.vtitle{font:500 28px/1.15 var(--serif);color:var(--hd);margin:11px 0 0;letter-spacing:-.005em}
.vlede{font:400 13.5px/1.6 var(--sans);color:var(--sc);margin:10px 0 0;max-width:740px;text-wrap:pretty}
.pad{padding:24px 32px 80px}

/* ------------------------------------------------------------------ banners */
.banner{padding:14px 18px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start}
.banner .tag{font:500 9.5px/1.6 var(--mono);letter-spacing:.14em;white-space:nowrap}
.banner .t{font:500 14px/1.5 var(--sans);color:var(--hd)}
.banner .b{font:400 13px/1.6 var(--sans);color:var(--tx);margin-top:6px;max-width:900px;text-wrap:pretty}
.banner .m{font:400 11px/1.6 var(--mono);color:var(--sc);margin-top:8px}
.b-err{border:1px solid var(--errbd);border-left:3px solid var(--err);background:#241016}
.b-err .tag{color:var(--err)}
.b-warn{border:1px solid var(--warnbd);border-left:3px solid var(--warn);background:#211B10;
  align-items:baseline;flex-wrap:wrap}
.b-warn .tag{color:var(--warn)}
.b-warn .line{font:400 13.5px/1.6 var(--sans);color:var(--tx)}

/* -------------------------------------------------------------------- tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));
  border:1px solid var(--bd);background:var(--surf)}
.tile{padding:18px 20px 20px;border-right:1px solid var(--bd2)}
.tile:last-child{border-right:0}
.tile-lab{font:500 10px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sc)}
.tile-val{font:500 31px/1.1 var(--sans);font-variant-numeric:tabular-nums;margin-top:12px;
  letter-spacing:-.015em;color:var(--hd)}
.tile-note{font:400 12px/1.5 var(--sans);color:var(--sc);margin-top:9px;text-wrap:pretty}

/* ------------------------------------------------------------------ section */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin:38px 0 0;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.sechead h2{font:500 17px/1.2 var(--serif);color:var(--hd);margin:0}
.sechead .c{font:400 10.5px/1 var(--mono);color:var(--sc);letter-spacing:.08em;white-space:nowrap}
.subhead{margin:34px 0 0;padding-bottom:10px;border-bottom:1px solid var(--bd);
  display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.subhead h2{font:500 16px/1.2 var(--serif);color:var(--hd);margin:0}
.empty{padding:34px 0;font:400 13px/1.6 var(--sans);color:var(--sc);text-wrap:pretty}
.empty-box{border:1px dashed var(--bd4);padding:46px;text-align:center;
  font:400 13px/1.6 var(--sans);color:var(--sc)}

/* -------------------------------------------------------------------- pills */
.band{font:500 10px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;
  white-space:nowrap;display:inline-block}
.chip{font:400 10.5px/1.5 var(--mono);color:var(--sc);border:1px solid var(--bd4);
  padding:2px 7px;white-space:nowrap;display:inline-block}
.chip-dash{border-style:dashed;font-size:11.5px;padding:3px 9px}

/* ------------------------------------------------------------------- quotes */
.quotes{margin-top:12px;display:flex;flex-direction:column;gap:9px;max-width:640px}
.quote{border-left:1px solid var(--o3);padding:1px 0 1px 13px}
.quote .t{font:400 13px/1.55 var(--sans);color:var(--tx);text-wrap:pretty}
.quote .s{font:400 11px/1.5 var(--mono);color:var(--sc);margin-top:4px;letter-spacing:.03em}

/* ------------------------------------------------------------------- triage */
.cut{display:flex;align-items:center;gap:14px;margin:26px 0 4px}
.cut .l{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sc);white-space:nowrap}
.cut .r{flex:1;height:1px;background:var(--bd);display:block}
.cut .n{font:400 11px/1 var(--sans);color:var(--sc)}
.qrow{display:grid;grid-template-columns:56px minmax(0,1fr) 210px;border-bottom:1px solid var(--bd3);
  padding:20px 0;align-items:start;width:100%;text-align:left;background:none;border-top:0;
  border-left:0;border-right:0;cursor:pointer;transition:background 200ms var(--ease)}
.qrow:hover{background:rgba(255,255,255,.018)}
.qrow:focus-visible{outline:1px solid var(--o2);outline-offset:2px}
.qrank{font:500 26px/1 var(--mono);letter-spacing:-.03em;padding-top:1px;color:var(--sc)}
.qrank.top{color:var(--o)}
.qmain{min-width:0;padding-right:28px}
.qname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qname .nm{font:500 15px/1.35 var(--sans);color:var(--hd)}
.qact{font:400 14.5px/1.5 var(--sans);color:var(--tx);margin-top:9px;text-wrap:pretty}
.qwhy{font:400 13px/1.6 var(--sans);color:var(--sc);margin-top:6px;text-wrap:pretty}
.qmeta{display:flex;flex-direction:column;gap:9px;border-left:1px solid var(--bd3);padding-left:20px}
.mrow{display:flex;justify-content:space-between;gap:10px}
.mrow .k{font:400 10px/1.4 var(--mono);color:var(--sc);letter-spacing:.1em;text-transform:uppercase}
.mrow .v{font:500 13px/1.4 var(--mono);color:var(--hd)}
.mrow .v.s{font:400 12px/1.4 var(--sans);color:var(--tx);text-align:right}
.meter{height:3px;background:var(--bd2);display:block}
.meter i{display:block;height:3px}

/* -------------------------------------------------------------------- panel */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:22px;
  margin-top:44px;align-items:start}
.panel{border:1px solid var(--bd);background:var(--surf)}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--bd2);display:flex;
  align-items:baseline;justify-content:space-between;gap:12px}
.panel-head .t{font:500 12.5px/1.4 var(--sans);color:var(--hd)}
.panel-head .c{font:400 10px/1.4 var(--mono);color:var(--sc);letter-spacing:.08em;white-space:nowrap}
.panel-row{padding:13px 18px;border-bottom:1px solid var(--bd3)}
.panel-row:last-child{border-bottom:0}
.panel-row.flex{display:flex;align-items:center;justify-content:space-between;gap:14px}
.panel-row.click{cursor:pointer;transition:background 200ms var(--ease)}
.panel-row.click:hover{background:var(--surf2)}
.panel-body{padding:18px}
.pn{font:400 13.5px/1.4 var(--sans);color:var(--tx)}
.pv{font:500 12.5px/1.4 var(--mono);color:var(--sc)}

/* ------------------------------------------------------------------- tables */
.tblwrap{border:1px solid var(--bd);background:var(--surf);overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-family:var(--sans)}
table.t th{text-align:left;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--sc);padding:14px 16px;border-bottom:1px solid var(--bd4);white-space:nowrap}
table.t td{padding:14px 16px;border-bottom:1px solid var(--bd3);vertical-align:top}
table.t tbody tr{transition:background 200ms var(--ease)}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--surf2)}
.r{text-align:right}
.crmcol{background:var(--surf2)}
.num{font:500 13px/1.4 var(--mono);color:var(--hd);white-space:nowrap}
.mono{font:400 12px/1.4 var(--mono);color:var(--sc)}
.nm{font:500 13.5px/1.35 var(--sans);color:var(--hd);white-space:nowrap}
.sub{font:400 10.5px/1.5 var(--mono);color:var(--sc);margin-top:4px}
.say{font:400 13px/1.55 var(--sans);color:var(--tx);text-wrap:pretty}

/* --------------------------------------------------------------- gaps grid */
.gapwrap{border:1px solid var(--bd);background:var(--surf)}
.gaprow{display:grid;grid-template-columns:minmax(140px,1.1fr) 118px minmax(210px,1.4fr) minmax(0,1.7fr);
  border-bottom:1px solid var(--bd3);border-left:3px solid transparent;align-items:center;
  width:100%;text-align:left;background:none;border-top:0;border-right:0;cursor:pointer;
  transition:background 200ms var(--ease)}
.gaprow:hover{background:var(--surf2)}
.gaprow:focus-visible{outline:1px solid var(--o2);outline-offset:-1px}
.gaphead{display:grid;grid-template-columns:minmax(140px,1.1fr) 118px minmax(210px,1.4fr) minmax(0,1.7fr);
  border-bottom:1px solid var(--bd4)}
.gaphead div{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--sc);padding:14px 18px}
.gapcell{padding:15px 18px}
.gapverdict{font:400 10px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:5px}

/* ----------------------------------------------------------------- renewals */
.fcast{border:1px solid var(--bd);background:var(--surf);padding:26px 28px 28px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:26px}
.fbig{font:500 35px/1.1 var(--sans);font-variant-numeric:tabular-nums;margin-top:12px;letter-spacing:-.015em}
.fnote{font:400 12.5px/1.5 var(--sans);color:var(--sc);margin-top:8px}
.fbar{height:22px;background:var(--bd2);display:flex;margin-top:28px}
.fbar span{display:block;height:22px}
.fbar .a{background:var(--ok)}
.fbar .b{background:repeating-linear-gradient(135deg,#4A1420 0 6px,#2C1017 6px 12px)}
.fkeys{display:flex;justify-content:space-between;margin-top:9px}
.fkeys span{font:400 10.5px/1 var(--mono);letter-spacing:.08em}
.bkt{margin-top:32px}
.bkt-head{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bkt-head .arr{font:500 14px/1.4 var(--mono);color:var(--hd)}
.bkt-head .cnt{font:400 12.5px/1.4 var(--sans);color:var(--sc)}
.bkt-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 120px 150px;border-bottom:1px solid var(--bd3);
  align-items:center;width:100%;text-align:left;background:none;border-top:0;border-left:0;border-right:0;
  cursor:pointer;transition:background 200ms var(--ease)}
.bkt-row:hover{background:rgba(255,255,255,.018)}
.bkt-row>*{padding:12px 0}
.bkt-prob{padding:12px 0 12px 22px;display:flex;align-items:center;gap:10px}
.bkt-prob .track{flex:1;height:3px;background:var(--bd2);display:block}
.bkt-prob .track i{display:block;height:3px}
.bkt-prob .p{font:500 11.5px/1.4 var(--mono);color:var(--sc);width:36px;text-align:right}

/* ---------------------------------------------------------------- expansion */
.xhead{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.xhead.trap{border-bottom-color:#58202F;margin-top:52px}
.xhead .sq{width:7px;height:7px;display:block;margin-bottom:2px;flex:none}
.xhead h2{font:500 17px/1.2 var(--serif);color:var(--hd);margin:0;white-space:nowrap}
.xhead .c{font:400 11px/1.5 var(--mono);color:var(--sc);letter-spacing:.06em;white-space:nowrap}
.xnote{font:400 13.5px/1.6 var(--sans);color:var(--sc);margin-top:14px;max-width:700px;text-wrap:pretty}
.xrow{display:grid;grid-template-columns:minmax(180px,220px) minmax(0,1fr);border-bottom:1px solid var(--bd3);
  padding:24px 0;align-items:start}
.xleft{padding-right:28px}
.xleft .xnm{font:500 15px/1.35 var(--sans);color:var(--hd);cursor:pointer;
  transition:color 200ms var(--ease)}
.xleft .xnm:hover{color:var(--o2)}
.xflag{display:flex;align-items:center;gap:8px;margin-top:10px}
.xflag .sq{width:6px;height:6px;display:block;flex:none}
.xflag .l{font:500 10px/1.5 var(--mono);letter-spacing:.13em;text-transform:uppercase}
.xmeta{font:400 12px/1.5 var(--mono);color:var(--sc);margin-top:9px}
.xbody{min-width:0;padding-left:26px;border-left:1px solid var(--okbd)}
.xbody.trap{border-left-color:#58202F}
.xtitle{font:400 16.5px/1.5 var(--sans);color:var(--hd);letter-spacing:-.005em;max-width:640px;text-wrap:pretty}
.xtitle.dim{color:var(--sc)}
.xreason{font:400 14px/1.6 var(--sans);color:var(--err2);margin-top:14px;max-width:640px;text-wrap:pretty}
.xbasis{font:400 11.5px/1.6 var(--mono);color:var(--sc);margin-top:10px;max-width:620px}
.callout{margin-top:16px;padding:13px 16px;border-left:2px solid var(--o);background:#231A15;max-width:640px}
.callout .k{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--o)}
.callout .v{font:400 13.5px/1.55 var(--sans);color:var(--tx);margin-top:8px;text-wrap:pretty}
.callout .v.hd{color:var(--hd)}

/* ----------------------------------------------------------- contradictions */
.stack{display:flex;flex-direction:column;gap:20px}
.cx-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:baseline;
  gap:12px;flex-wrap:wrap;cursor:pointer}
.cx-head:hover .nm2{color:var(--o2)}
.nm2{font:500 14px/1.3 var(--sans);color:var(--hd);transition:color 200ms var(--ease)}
.cx-topic{font:400 11.5px/1.5 var(--mono);color:var(--sc)}
.cx-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.cx-side{padding:18px 20px}
.cx-side.a{border-right:1px solid var(--bd)}
.cx-key{display:flex;align-items:center;gap:8px}
.cx-key .id{font:500 11px/1 var(--mono);color:var(--sc)}
.cx-key .id.b{color:var(--o)}
.cx-key .src{font:400 10.5px/1.5 var(--mono);color:var(--sc)}
.cx-claim{font:400 14px/1.6 var(--sans);margin-top:10px;text-wrap:pretty}
.cx-res{border-top:1px solid var(--bd);padding:15px 20px;border-left:3px solid var(--o)}
.cx-res .k{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--o)}
.cx-res .v{font:400 13.5px/1.6 var(--sans);color:var(--tx);margin-top:8px;text-wrap:pretty}
.cx-res .w{font:400 12.5px/1.6 var(--sans);color:var(--sc);margin-top:8px;text-wrap:pretty}

/* ------------------------------------------------------------------ winback */
.wb-head{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;
  justify-content:space-between;gap:18px;flex-wrap:wrap}
.wb-name{font:500 17px/1.25 var(--serif);color:var(--hd);cursor:pointer;transition:color 200ms var(--ease)}
.wb-name:hover{color:var(--o2)}
.wb-stats{display:flex;align-items:center;gap:22px}
.wb-k{font:400 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sc)}
.wb-v{font:500 16px/1.3 var(--sans);font-variant-numeric:tabular-nums;color:var(--err2);margin-top:5px}
.wb-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.wb-side{padding:20px 22px}
.wb-side.a{border-right:1px solid var(--bd)}
.wb-lab{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sc)}
.wb-txt{font:400 13.5px/1.6 var(--sans);color:var(--tx);margin-top:11px;text-wrap:pretty}
.wb-dim{font:400 12.5px/1.6 var(--sans);color:var(--sc);margin-top:10px;text-wrap:pretty}

/* -------------------------------------------------------------------- feed */
.feed-row{display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid var(--surf2);flex-wrap:wrap}
.feed-ct{font:500 10px/1.5 var(--mono);letter-spacing:.14em;min-width:82px}
.feed-st{font:400 11px/1.5 var(--mono);color:var(--sc);min-width:150px}
.feed-lb{font:400 12.5px/1.5 var(--sans);color:var(--tx)}
.scrollbox{max-height:420px;overflow-y:auto}
.belief{display:grid;grid-template-columns:170px minmax(0,1fr);border-bottom:1px solid var(--bd3);
  padding:14px 0;align-items:start}
.belief .st{font:400 11px/1.6 var(--mono);color:var(--sc)}
.belief .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.belief .acc{font:500 13px/1.4 var(--sans);color:var(--hd)}
.belief .fl{font:400 11px/1.5 var(--mono);color:var(--sc)}
.belief .ov{font:400 12.5px/1.5 var(--mono);color:var(--sc);text-decoration:line-through}
.belief .nv{font:400 12.5px/1.5 var(--mono);color:var(--o)}
.belief .nr{font:400 13px/1.6 var(--sans);color:var(--sc);margin-top:6px;text-wrap:pretty}
.wd-box{border:1px solid var(--errbd);border-left:3px solid var(--err);background:#221016;margin-top:26px}
.wd-head{padding:15px 20px;border-bottom:1px solid #4A1420}
.wd-head .t{font:500 13px/1.3 var(--sans);color:var(--err)}
.wd-head .b{font:400 12.5px/1.6 var(--sans);color:var(--tx);margin-top:6px;max-width:780px;text-wrap:pretty}
.wd-row{display:flex;align-items:baseline;gap:16px;padding:12px 20px;border-bottom:1px solid #3A141C;flex-wrap:wrap}
.wd-row:last-child{border-bottom:0}
.wd-row .k{font:500 10px/1.5 var(--mono);letter-spacing:.14em;color:var(--err)}
.wd-row .o{font:400 12.5px/1.5 var(--mono);color:var(--tx);text-decoration:line-through}
.wd-row .s{font:400 11px/1.5 var(--mono);color:var(--sc)}
.wd-row .st{font:400 11px/1.5 var(--mono);color:var(--sc);margin-left:auto}
table.plain{width:100%;border-collapse:collapse;font-family:var(--sans)}
table.plain th{text-align:left;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--sc);padding:13px 14px;border-bottom:1px solid var(--bd)}
table.plain th:first-child,table.plain td:first-child{padding-left:0}
table.plain td{padding:12px 14px;border-bottom:1px solid var(--bd3);font:400 12.5px/1.4 var(--mono);color:var(--sc)}

/* ------------------------------------------------------------ account view */
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;
  font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--o);
  margin-bottom:20px;transition:color 200ms var(--ease)}
.back:hover{color:var(--o4)}
.a-tags{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.a-one{font:400 16.5px/1.55 var(--sans);color:var(--hd);margin:18px 0 0;max-width:760px;text-wrap:pretty}
.a-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:22px;
  margin-top:24px;align-items:start}
.fac{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:14px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--bd3)}
.fac:last-child{border-bottom:0}
.fac .k{font:500 12.5px/1.35 var(--sans);color:var(--hd)}
.fac .w{font:400 10px/1.5 var(--mono);color:var(--sc);margin-top:4px}
.fac .rs{font:400 12.5px/1.55 var(--sans);color:var(--tx);text-wrap:pretty}
.fac .lost{font:500 13px/1.4 var(--mono);text-align:right}
.big{font:500 31px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.015em;color:var(--hd)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;margin:0}
.dl dt{font:400 10px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sc)}
.dl dd{margin:0;font:400 13px/1.6 var(--sans);color:var(--tx)}
.risk{padding:16px 0;border-bottom:1px solid var(--bd3)}
.risk:first-child{padding-top:0}
.risk:last-child{border-bottom:0;padding-bottom:0}
.risk .t{font:500 14.5px/1.45 var(--sans);color:var(--hd);margin-top:9px;text-wrap:pretty}
.risk .w{font:400 13px/1.6 var(--sans);color:var(--sc);margin-top:6px;text-wrap:pretty}
.act{display:grid;grid-template-columns:44px minmax(0,1fr) 170px;border-bottom:1px solid var(--bd3);
  padding:18px 0;align-items:start}
.act:last-child{border-bottom:0}

@media (max-width:1180px){
  .qrow{grid-template-columns:48px minmax(0,1fr)}
  .qmeta{grid-column:1/-1;border-left:0;padding-left:0;margin-top:16px;padding-top:14px;
    border-top:1px solid var(--bd3);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px 22px}
  .gaphead{display:none}
  .gaprow{grid-template-columns:1fr 1fr}
  .bkt-row{grid-template-columns:minmax(0,1fr) 110px}
  .bkt-prob{grid-column:1/-1;padding-left:0}
  .fac{grid-template-columns:1fr;gap:6px}
  .fac .lost{text-align:left}
  .act{grid-template-columns:1fr;gap:12px}
}
@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--bd2)}
  .railnav{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0;
    border-top:1px solid var(--bd2);-webkit-overflow-scrolling:touch}
  .navgroup,.navbtn{flex:none}
  .navbtn{width:auto}
  .navgroup{margin:0;display:flex;align-items:center;border-right:1px solid var(--bd2)}
  .navlabel{display:none}
  .railfoot{display:none}
  .vhead,.pad{padding-left:16px;padding-right:16px}
  .xrow{grid-template-columns:1fr;gap:16px}
  .xbody{padding-left:16px}
  .cx-side.a,.wb-side.a{border-right:0;border-bottom:1px solid var(--bd)}
}
</style>
</head>
<body>

<div class="shell">

  <aside class="rail">
    <div class="rail-top">
      <div class="mark">
        <!-- Brand dot plus a type-set product wordmark. The FlytBase mark is deliberately
             not reproduced here; this slot is where it would be dropped in. -->
        <span class="mark-dot"></span>
        <span class="wordmark">TOWER</span>
      </div>
      <div class="rail-sub">FlytBase GTM control tower</div>
    </div>
    <nav class="railnav" id="nav" aria-label="Views"></nav>
    <div class="railfoot">
      <div class="livewrap"><span class="live-dot" id="livedot"></span>
        <span class="live-txt" id="livetxt">connecting</span></div>
      <div class="live-stamp" id="livestamp"></div>
    </div>
  </aside>

  <div class="content">
    <header class="vhead">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="vtitle" id="vtitle">Triage</h1>
      <p class="vlede" id="vlede"></p>
    </header>
    <main class="pad" id="app"></main>
  </div>

</div>

<script>
"use strict";
/* =====================================================================
   TOWER, single-file GTM control tower.
   No build step, no runtime framework, no third-party script. Data
   contract: portfolio.json plus accounts/<id>.json, refreshed every 30s.
   ===================================================================== */

function $(s){ return document.querySelector(s); }

/* ------------------------------------------------------------- formatting */
function money(n){ return n == null ? "—" : "$" + Math.round(n).toLocaleString(); }
function pct(n){ return n == null ? "—" : (n > 0 ? "+" : "") + Math.round(n) + "%"; }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function stamp(t){ return String(t == null ? "" : t).replace("T", " ").replace("+00:00", ""); }

/* The pipeline writes a bracketed placeholder wherever the reading layer
   would have written a sentence. That is an internal note, not copy. */
function clean(s){
  var v = String(s == null ? "" : s).trim();
  return v.indexOf("[degraded mode") === 0 ? "" : v;
}
/* Belief deltas store JSON-encoded scalars, e.g. "\"minor\"". */
function scalar(v){
  var s = String(v == null ? "" : v);
  try { var p = JSON.parse(s); return (p !== null && typeof p === "object") ? s : String(p); }
  catch (e) { return s; }
}
function clamp(n){ return Math.max(0, Math.min(100, Number(n) || 0)); }
/* Renewal dates in the source are sometimes already behind us. "-28 days" is
   not a sentence anyone reads correctly, so say what it means. */
function days(n, short){
  if (n == null) return short ? "not set" : "date not set";
  if (n < 0) return Math.abs(n) + (short ? "d overdue" : " days overdue");
  return n + (short ? "d" : " days");
}
function todayISO(){
  var d = new Date();
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0")
    + "-" + String(d.getUTCDate()).padStart(2, "0");
}

/* ----------------------------------------------------------------- tokens */
var BANDS = {
  "Healthy":["#8FC9B4","#16211D","#2B5A4A"], "Strong":["#8FC9B4","#16211D","#2B5A4A"],
  "Secure":["#8FC9B4","#16211D","#2B5A4A"], "Likely":["#72A899","#141E1B","#25443A"],
  "Watch":["#E0B45C","#231E11","#4A3A16"], "At Risk":["#F0768D","#271219","#58202F"],
  "High Risk":["#F43F5E","#2C1017","#6E1E30"], "Critical":["#F43F5E","#2C1017","#6E1E30"],
  "Lost":["#F43F5E","#2C1017","#6E1E30"], "Not Applicable":["#999999","#242424","#3D3D3D"]
};
var VERD = {
  "pursue-now":["#8FC9B4","#16211D","#2B5A4A","Pursue now"],
  "pursue-later":["#E0B45C","#231E11","#4A3A16","Pursue later"],
  "do-not-pursue":["#F0768D","#271219","#58202F","Do not pursue"],
  "not-applicable":["#999999","#242424","#3D3D3D","Nothing to chase"]
};
var CT = {ADDED:"#72A899", MODIFIED:"#D9A441", WITHDRAWN:"#F43F5E", RESTORED:"#3E6F9E"};

function band(b){
  if (BANDS[b]) return BANDS[b];
  var k = Object.keys(BANDS).filter(function(x){ return String(b || "").indexOf(x) === 0; })[0];
  return BANDS[k] || BANDS["Not Applicable"];
}
function pill(label, extra){
  var c = band(label);
  return '<span class="band" style="' + (extra || "") + 'color:' + c[0] + ';background:' + c[1]
    + ';border:1px solid ' + c[2] + '">' + esc(label == null || label === "" ? "—" : label) + '</span>';
}

/* -------------------------------------------------------------- structure */
var GROUPS = [
  {label:"Act",    items:[["triage","Triage","01"], ["expansion","Expansion & Traps","02"]]},
  {label:"Money",  items:[["renewals","Renewals","03"], ["winback","Win-back","04"]]},
  {label:"Check",  items:[["accounts","Accounts","05"], ["gaps","Reality Gap","06"],
                          ["contradictions","Contradictions","07"], ["flight","Flight Activity","08"]]},
  {label:"System", items:[["feed","Change Feed","09"]]}
];
var META = {
  triage:["01 / Act", "Triage", "What to do first this morning, ranked by how much money moves for the effort it takes. Every line shows the evidence behind it."],
  accounts:["05 / Check", "Accounts", "Health here is calculated from what the account actually does. The CRM label sits beside it so a wrong record is visible at a glance."],
  renewals:["03 / Money", "Renewals", "One number assumes every account renews. The other weighs each one by how likely it is. The difference is what this screen is for."],
  expansion:["02 / Act", "Expansion & Traps", "What is genuinely worth selling, and what only looks like it. A Trap is something the customer has asked for that would make the account worse if we sold it."],
  gaps:["06 / Check", "Reality Gap", "Where the CRM label disagrees with how the account behaves. Red means the record is more optimistic than the evidence supports."],
  contradictions:["07 / Check", "Contradictions", "Two sources say different things. Both claims are kept, and the one we believe is stated with the reason."],
  winback:["04 / Money", "Win-back", "One card per lost account, with a verdict on whether it is worth chasing."],
  flight:["08 / Check", "Flight Activity", "Monthly flight hours per account, and whether that trend agrees with the health label on the record."],
  feed:["09 / System", "Change Feed", "Proof the page updates itself. Every source document is checked each cycle, including the ones that disappear."]
};
var VIEW_KEYS = GROUPS.reduce(function(a, g){
  return a.concat(g.items.map(function(i){ return i[0]; }));
}, []);

/* ------------------------------------------------------------------ state */
var PF = null, VIEW = "triage", ACC = null, CACHE = {}, FAILED = false;

/* -------------------------------------------------------------- sparkline */
function spark(values, w, h){
  var v = (values || []).filter(function(x){ return typeof x === "number" && isFinite(x); });
  if (v.length < 2) return "";
  var mx = Math.max.apply(null, v.concat([1])), mn = Math.min.apply(null, v.concat([0]));
  var rng = (mx - mn) || 1;
  var pts = v.map(function(x, i){ return [i / (v.length - 1) * w, h - ((x - mn) / rng) * (h - 5) - 2.5]; });
  var d = pts.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var col = v[v.length - 1] >= v[0] ? "#72A899" : "#F0768D";
  var last = pts[pts.length - 1];
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h
    + '" style="display:block" aria-hidden="true">'
    + '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.4" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.3" fill="' + col + '"/></svg>';
}

/* Evidence quotes arrive as "quote text|source". */
function quotes(list){
  var out = (list || []).map(function(q){
    var s = String(q), i = s.lastIndexOf("|");
    var text = i < 0 ? s : s.slice(0, i), src = i < 0 ? "" : s.slice(i + 1);
    return '<div class="quote"><div class="t">“' + esc(text) + '”</div>'
      + (src ? '<div class="s">' + esc(src) + '</div>' : '') + '</div>';
  });
  return out.length ? '<div class="quotes">' + out.join("") + '</div>' : '';
}
function metaRow(k, v, color, soft){
  return '<span class="mrow"><span class="k">' + esc(k) + '</span>'
    + '<span class="v' + (soft ? " s" : "") + '"' + (color ? ' style="color:' + color + '"' : '') + '>'
    + esc(v) + '</span></span>';
}

/* ---------------------------------------------------------------- routing */
function parseHash(){
  var h = String(location.hash || "").replace(/^#\/?/, "");
  if (h.indexOf("account/") === 0){
    var id = decodeURIComponent(h.slice(8));
    if (id){ ACC = id; return; }
  }
  ACC = null;
  VIEW = VIEW_KEYS.indexOf(h) >= 0 ? h : "triage";
}
function go(k){ location.hash = "#/" + k; }
function openAcc(id){ location.hash = "#/account/" + encodeURIComponent(id); }

/* -------------------------------------------------------------------- nav */
function renderNav(){
  $("#nav").innerHTML = GROUPS.map(function(g){
    return '<div class="navgroup"><div class="navlabel">' + esc(g.label) + '</div>'
      + g.items.map(function(it){
          var on = !ACC && it[0] === VIEW;
          return '<button class="navbtn' + (on ? " on" : "") + '" data-go="' + it[0] + '"'
            + (on ? ' aria-current="page"' : '') + '>'
            + '<span class="n">' + it[2] + '</span><span>' + esc(it[1]) + '</span></button>';
        }).join("")
      + '</div>';
  }).join("");
}
function renderHead(){
  if (ACC){
    var s = CACHE[ACC];
    $("#eyebrow").textContent = "Account";
    $("#vtitle").textContent = s ? s.name : ACC;
    $("#vlede").textContent = "Every number here traces to a named factor or a source document. "
      + "Anything read out of a document carries the sentence it came from.";
    return;
  }
  var m = META[VIEW] || ["", "", ""];
  $("#eyebrow").textContent = m[0];
  $("#vtitle").textContent = m[1];
  $("#vlede").textContent = m[2];
}
function tickLive(){
  var ls = PF && PF.system ? PF.system.last_sync : null;
  $("#livedot").className = "live-dot" + (PF ? "" : " off");
  $("#livetxt").textContent = PF
    ? ("live · sync #" + (ls && ls.id != null ? ls.id : "—"))
    : (FAILED ? "no data published" : "connecting");
  $("#livestamp").textContent = PF
    ? String(PF.generated_at || "").replace("T", " ").replace("+00:00", " UTC") : "";
}

/* --------------------------------------------------------------- degraded */
function isDegraded(){
  if (!PF) return false;
  if (PF.reading && PF.reading.enabled === false) return true;
  return (PF.accounts || []).some(function(a){ return a.degraded; });
}
function degradedBanner(){
  if (!isDegraded()) return "";
  var r = PF.reading || {};
  var detail = "reading provider " + (r.provider || "none")
    + (r.last_error ? " · last error: " + r.last_error : " · no model key configured");
  return '<div class="banner b-err"><span class="tag">DEGRADED</span><div>'
    + '<div class="t">This page is incomplete. The part that reads documents is not running.</div>'
    + '<div class="b">Everything shown is still true. Account health, usage, the Reality Gap and the '
    + 'ranking are all calculated directly from the data and do not need a model. What is missing is '
    + 'anything read out of a document: people, risks, opportunities, Traps and recommended actions.</div>'
    + '<div class="m">' + esc(detail) + '</div></div></div>';
}
function emptyMsg(){
  return isDegraded() ? "Not available while the part that reads documents is off."
                      : "Nothing here right now.";
}

/* ================================================================= TRIAGE */
function vTriage(){
  var m = PF.money || {}, c = PF.counts || {};
  var mis = (PF.reality_gaps || []).filter(function(g){
    return g.direction === "overstated" && Math.abs(g.gap) >= 1;
  });
  var misARR = mis.reduce(function(s, g){ return s + (g.arr || 0); }, 0);
  var worth = (PF.winbacks || []).filter(function(w){
    return w.verdict !== "do-not-pursue" && w.verdict !== "not-applicable";
  }).length;

  var tiles = [
    ["Live ARR", money(m.live_arr), "#F0F0F0",
      (c.live || 0) + " live, " + (c.presale || 0) + " in pre-sale, " + (c.churned || 0) + " churned"],
    ["Honest forecast", money(m.weighted_forecast), "#F0F0F0", "the CRM implies " + money(m.naive_forecast)],
    ["At risk of not renewing", money(m.forecast_gap), "#F43F5E", "the gap between the labels and the evidence"],
    ["Already lost", money(m.lost_arr), "#F0768D", worth + " judged worth chasing"]
  ];

  var all = PF.action_queue || [], queue = all.slice(0, 8);
  var rows = queue.map(function(a, i, arr){
    var bd = band(a.health_band);
    var below = a.value_score < 70;
    var cut = i > 0 && arr[i - 1].value_score >= 70 && below;
    var renewColor = (a.days_to_renewal != null && a.days_to_renewal < 90) ? "#F0768D" : "#D6D6D6";
    var scoreColor = a.value_score >= 80 ? "#F43F5E" : a.value_score >= 60 ? "#D9A441" : "#999999";
    return (cut
        ? '<div class="cut"><span class="l">Below the line</span><span class="r"></span>'
          + '<span class="n">worth doing, not worth doing first</span></div>' : '')
      + '<button class="qrow" data-acc="' + esc(a.account_id) + '" style="opacity:' + (below ? ".85" : "1") + '">'
      + '<span class="qrank' + (!below && i === 0 ? " top" : "") + '">'
        + esc(String(a.rank).padStart(2, "0")) + '</span>'
      + '<span class="qmain">'
        + '<span class="qname"><span class="nm">' + esc(a.account_name) + '</span>'
        + '<span class="band" style="color:' + bd[0] + ';background:' + bd[1] + ';border:1px solid '
          + bd[2] + '">' + esc(a.health_band) + '</span></span>'
        + '<span class="qact" style="display:block">' + esc(a.action) + '</span>'
        + '<span class="qwhy" style="display:block">' + esc(a.why_now) + '</span>'
        + quotes(a.evidence_quotes)
      + '</span>'
      + '<span class="qmeta">'
        + metaRow("ARR", money(a.arr))
        + metaRow("Renews", days(a.days_to_renewal, false), renewColor)
        + metaRow("Owner", a.owner_function || "—", null, true)
        + metaRow("Call", a.target_person || "—", null, true)
        + '<span style="display:block;margin-top:3px">'
          + '<span class="mrow" style="margin-bottom:5px"><span class="k">Priority</span>'
          + '<span class="v" style="font-size:11px;color:#999999">' + esc(a.value_score) + '</span></span>'
          + '<span class="meter"><i style="width:' + clamp(a.value_score) + '%;background:' + scoreColor + '"></i></span>'
        + '</span>'
      + '</span></button>';
  }).join("");

  var stale = PF.stale_accounts || [], loops = PF.open_loops || [];

  return degradedBanner()
    + '<div class="tiles">' + tiles.map(function(t){
        return '<div class="tile"><div class="tile-lab">' + esc(t[0]) + '</div>'
          + '<div class="tile-val" style="color:' + t[2] + '">' + esc(t[1]) + '</div>'
          + '<div class="tile-note">' + esc(t[3]) + '</div></div>';
      }).join("") + '</div>'
    + (misARR > 0
        ? '<div class="banner b-warn" style="margin:18px 0 0"><span class="tag">REALITY GAP</span>'
          + '<span class="line">' + mis.length + ' of ' + (c.accounts || 0)
          + ' accounts are labelled healthier than their own behaviour supports, covering '
          + money(misARR) + ' of ARR.</span></div>'
        : '')
    + '<div class="sechead"><h2>Do these first</h2><span class="c">'
      + (all.length ? queue.length + ' of ' + all.length + ' shown' : 'nothing queued') + '</span></div>'
    + (rows || '<div class="empty">' + esc(emptyMsg())
        + ' The ranking needs a recommended action for each account, and those are read out of the source '
        + 'documents. Reality Gap, Renewals and Flight Activity do not depend on that and still show where '
        + 'the money is moving.</div>')
    + '<div class="cols">'
      + '<div class="panel"><div class="panel-head"><span class="t">Gone quiet</span>'
        + '<span class="c">NO CONTACT 45 DAYS+</span></div>'
        + (stale.length
            ? stale.map(function(s){
                return '<div class="panel-row flex click" data-acc="' + esc(s.account_id) + '">'
                  + '<span class="pn">' + esc(s.name) + '</span>'
                  + '<span style="display:flex;align-items:center;gap:14px">'
                  + '<span class="pv">' + money(s.arr) + '</span>'
                  + '<span class="pv" style="color:#D9A441">' + esc(s.days_silent) + ' days quiet</span></span></div>';
              }).join("")
            : '<div class="panel-row"><span class="pn" style="color:#999999">No account has gone quiet for '
              + 'more than 45 days.</span></div>')
      + '</div>'
      + '<div class="panel"><div class="panel-head"><span class="t">Promises we made and never closed</span>'
        + '<span class="c">' + loops.length + '</span></div>'
        + (loops.length
            ? loops.slice(0, 8).map(function(l){
                var overdue = l.due && /^\d{4}-\d{2}-\d{2}$/.test(l.due) && l.due < todayISO();
                return '<div class="panel-row click" data-acc="' + esc(l.account_id) + '">'
                  + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px">'
                  + '<span class="pn">' + esc(l.promise) + '</span>'
                  + '<span style="font:400 11px/1.4 var(--mono);white-space:nowrap;color:'
                    + (overdue ? "#F43F5E" : "#999999") + '">'
                    + (l.due ? "due " + esc(l.due) : "no date") + '</span></div>'
                  + '<div class="sub">' + esc(l.account_name) + ' · ' + esc(l.doc || "") + '</div></div>';
              }).join("")
            : '<div class="panel-row"><span class="pn" style="color:#999999">No open FlytBase-side '
              + 'commitments detected.</span></div>')
      + '</div>'
    + '</div>';
}

/* =============================================================== ACCOUNTS */
function vAccounts(){
  /* When the reading layer is off, every cell in this column carries the same
     sentence. Repeating it fourteen times is noise, so the column comes out and
     the banner above carries the explanation once. */
  var hasNarrative = (PF.accounts || []).some(function(a){ return !!clean(a.one_line); });
  var rows = (PF.accounts || []).map(function(a){
    var over = a.reality_gap && a.reality_gap.direction === "overstated";
    var one = clean(a.one_line);
    var up = a.usage_pct == null ? "" : pct(a.usage_pct);
    var uc = (a.usage_pct || 0) < 0 ? "#F0768D" : "#72A899";
    var rn = (a.renewal && a.renewal.days_to_renewal != null)
      ? days(a.renewal.days_to_renewal, true) + " · " + a.renewal.bucket : "not set";
    return '<tr class="click" data-acc="' + esc(a.account_id) + '">'
      + '<td><div class="nm">' + esc(a.name) + '</div><div class="sub">' + esc(a.vertical || "") + '</div></td>'
      + '<td><span class="chip">' + esc(a.lifecycle) + '</span></td>'
      + '<td class="r num">' + (a.arr ? money(a.arr) : "—") + '</td>'
      + '<td style="white-space:nowrap">' + pill(a.health_band)
        + '<span class="mono" style="margin-left:7px">' + esc(Math.round(a.health_score)) + '</span></td>'
      + '<td class="crmcol" style="white-space:nowrap">'
        + '<span style="font:400 12.5px/1.4 var(--sans);color:' + (over ? "#F43F5E" : "#999999") + '">'
        + esc(a.crm_health || "—") + (over ? "  ✖ wrong" : "") + '</span></td>'
      + '<td style="white-space:nowrap">'
        + '<span style="font:400 12.5px/1.4 var(--sans);color:#D6D6D6">' + esc(a.usage_trajectory) + '</span>'
        + (up ? '<span style="font:500 11.5px/1.4 var(--mono);color:' + uc + ';margin-left:7px">'
              + esc(up) + '</span>' : '')
      + '</td>'
      + '<td class="mono" style="white-space:nowrap">' + esc(rn) + '</td>'
      + (hasNarrative ? '<td class="say">' + (one ? esc(one)
          : '<span style="color:#999999">—</span>') + '</td>' : '') + '</tr>';
  }).join("");

  return degradedBanner()
    + '<div class="tblwrap"><table class="t"><thead><tr>'
    + '<th>Account</th><th>Stage</th><th class="r">ARR</th><th>What the evidence says</th>'
    + '<th class="crmcol">What the CRM says</th><th>Flying</th><th>Renewal</th>'
    + (hasNarrative ? '<th style="min-width:280px">Read this first</th>' : '')
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
    + (hasNarrative ? '' : '<div class="empty" style="padding-top:14px">The one-line read on each '
        + 'account is written by the part that reads documents. That column is hidden until it '
        + 'runs again.</div>');
}

/* =============================================================== RENEWALS */
function vRenewals(){
  var m = PF.money || {}, b = m.buckets || {};
  var hw = clamp(m.naive_forecast ? (m.weighted_forecast / m.naive_forecast) * 100 : 0);
  var order = ["Secure", "Likely", "At Risk", "High Risk", "Lost", "Not Applicable"];

  var buckets = order.filter(function(k){ return b[k] && b[k].count; }).map(function(k){
    return '<div class="bkt"><div class="bkt-head">'
      + pill(k, "font-size:11px;letter-spacing:.12em;padding:3px 9px;")
      + '<span class="arr">' + money(b[k].arr) + '</span>'
      + '<span class="cnt">' + b[k].count + (b[k].count === 1 ? " account" : " accounts") + '</span></div>'
      + (b[k].accounts || []).map(function(r){
          var p = r.probability == null ? null : Math.round(r.probability * 100);
          var pc = (r.probability || 0) >= .75 ? "#3A7A65" : (r.probability || 0) >= .5 ? "#D9A441" : "#F43F5E";
          return '<button class="bkt-row" data-acc="' + esc(r.id) + '">'
            + '<span style="font:400 13.5px/1.4 var(--sans);color:#D6D6D6">' + esc(r.name) + '</span>'
            + '<span class="r num">' + money(r.arr) + '</span>'
            + '<span class="r mono" style="font-size:12.5px">' + esc(days(r.days, false)) + '</span>'
            + '<span class="bkt-prob"><span class="track"><i style="width:' + (p == null ? 0 : p)
              + '%;background:' + pc + '"></i></span>'
            + '<span class="p">' + (p == null ? "—" : p + "%") + '</span></span></button>';
        }).join("")
      + '</div>';
  }).join("");

  return degradedBanner()
    + '<div class="fcast"><div class="fgrid">'
      + '<div><div class="tile-lab">What the CRM implies</div>'
        + '<div class="fbig" style="color:#999999">' + money(m.naive_forecast) + '</div>'
        + '<div class="fnote">if every live account renews in full</div></div>'
      + '<div><div class="tile-lab" style="color:#D95B28">Honest forecast</div>'
        + '<div class="fbig" style="color:#F0F0F0">' + money(m.weighted_forecast) + '</div>'
        + '<div class="fnote">each account weighted by how likely it is to renew</div></div>'
      + '<div><div class="tile-lab">The difference</div>'
        + '<div class="fbig" style="color:#F43F5E">' + money(m.forecast_gap) + '</div>'
        + '<div class="fnote">' + Math.round((m.forecast_gap / (m.naive_forecast || 1)) * 100)
        + '% of live ARR</div></div>'
    + '</div>'
    + '<div class="fbar"><span class="a" style="width:' + hw.toFixed(1) + '%"></span>'
      + '<span class="b" style="width:' + (100 - hw).toFixed(1) + '%"></span></div>'
    + '<div class="fkeys"><span style="color:#72A899">EXPECTED TO RENEW</span>'
      + '<span style="color:#F43F5E">AT RISK OF NOT RENEWING</span></div>'
    + '</div>' + buckets;
}

/* ============================================================== EXPANSION */
function vExpansion(){
  var opps = PF.opportunities || [], traps = PF.traps || [];

  function row(o, isTrap){
    var dq = (o.qualification && o.qualification.disqualifiers) || [];
    return '<div class="xrow"><div class="xleft">'
      + '<div class="xnm" data-acc="' + esc(o.account_id) + '">' + esc(o.account_name) + '</div>'
      + '<div class="xflag"><span class="sq" style="background:' + (isTrap ? "#F43F5E" : "#3A7A65") + '"></span>'
      + '<span class="l" style="color:' + (isTrap ? "#F43F5E;letter-spacing:.16em" : "#8FC9B4") + '">'
      + (isTrap ? "TRAP" : esc(o.confidence) + " confidence") + '</span></div>'
      + '<div class="xmeta">' + money(o.arr) + ' today</div>'
      + (isTrap ? '<div class="xmeta" style="margin-top:4px">flying ' + esc(o.usage_trajectory) + '</div>' : '')
      + '</div>'
      + '<div class="xbody' + (isTrap ? " trap" : "") + '">'
      + '<div class="xtitle' + (isTrap ? " dim" : "") + '">' + esc(o.opportunity) + '</div>'
      + (isTrap && o.trap_reason ? '<div class="xreason">' + esc(o.trap_reason) + '</div>' : '')
      + (isTrap && dq.length ? '<div class="xbasis">' + esc(dq.join("   ·   ")) + '</div>' : '')
      + (!isTrap && o.estimated_value_basis ? '<div class="xbasis">' + esc(o.estimated_value_basis) + '</div>' : '')
      + (o.unblock_condition
          ? '<div class="callout"><div class="k">Sell it once this is true</div>'
            + '<div class="v">' + esc(o.unblock_condition) + '</div></div>' : '')
      + quotes(o.evidence_quotes)
      + '</div></div>';
  }

  return degradedBanner()
    + '<div class="xhead"><span class="sq" style="background:#3A7A65"></span>'
      + '<h2>Worth selling</h2><span class="c">' + opps.length + ' open</span></div>'
    + (opps.length ? opps.map(function(o){ return row(o, false); }).join("")
                   : '<div class="empty">' + esc(emptyMsg()) + '</div>')
    + '<div class="xhead trap"><span class="sq" style="background:#F43F5E"></span>'
      + '<h2>Traps</h2><span class="c">' + traps.length + ' flagged</span></div>'
    + '<div class="xnote">Things the customer has asked for that we could sell today and should not. '
      + 'Each one says why, and what would have to be true before it becomes a real deal.</div>'
    + (traps.length ? traps.map(function(o){ return row(o, true); }).join("")
                    : '<div class="empty">' + esc(emptyMsg()) + '</div>');
}

/* =================================================================== GAPS */
function vGaps(){
  var rows = (PF.reality_gaps || []).slice().sort(function(x, y){
    return (y.gap || 0) - (x.gap || 0) || (y.arr || 0) - (x.arr || 0);
  }).map(function(g){
    var over = g.direction === "overstated";
    var edge = over ? (g.gap >= 2 ? "#F43F5E" : "#D9A441")
                    : g.direction === "understated" ? "#3A7A65" : "#3D3D3D";
    return '<button class="gaprow" data-acc="' + esc(g.account_id) + '" style="border-left-color:' + edge + '">'
      + '<span class="gapcell"><span class="nm" style="display:block;white-space:normal">'
        + esc(g.name) + '</span>'
        + '<span class="gapverdict" style="display:block;color:' + edge + '">'
        + (over ? "overstated by " + Math.abs(g.gap)
                : g.direction === "understated" ? "understated"
                : g.direction === "aligned" ? "agrees" : "no label to check") + '</span></span>'
      + '<span class="gapcell r num">' + (g.arr ? money(g.arr) : "—") + '</span>'
      + '<span class="gapcell" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        + '<span class="chip chip-dash">' + esc(g.stated || "no label") + '</span>'
        + '<span style="font:400 13px/1 var(--mono);color:' + edge + '">' + (over ? "→" : "=") + '</span>'
        + pill(g.derived, "font-size:11.5px;letter-spacing:.06em;padding:3px 9px;") + '</span>'
      + '<span class="gapcell" style="font:400 12.5px/1.55 var(--sans);color:#999999;text-wrap:pretty">'
        + esc(g.usage_headline || "") + '</span></button>';
  }).join("");

  return degradedBanner()
    + '<div class="gapwrap"><div class="gaphead">'
    + '<div>Account</div><div style="text-align:right">ARR</div>'
    + '<div>CRM label against behaviour</div><div>What the flying shows</div></div>'
    + rows + '</div>';
}

/* ========================================================= CONTRADICTIONS */
function vContra(){
  var rows = (PF.contradictions || []).map(function(c){
    var open = /^unresolved/i.test(c.resolution || "");
    var col = open ? "#D9A441" : "#D95B28";
    return '<div class="panel">'
      + '<div class="cx-head" data-acc="' + esc(c.account_id) + '">'
        + '<span class="nm2">' + esc(c.account_name) + '</span>'
        + '<span class="cx-topic">' + esc(c.topic) + '</span></div>'
      + '<div class="cx-cols">'
        + '<div class="cx-side a"><div class="cx-key"><span class="id">A</span>'
          + '<span class="src">' + esc(c.source_a) + '</span></div>'
          + '<div class="cx-claim" style="color:#999999;text-decoration:'
          + (open ? "none" : "line-through") + '">' + esc(c.claim_a) + '</div></div>'
        + '<div class="cx-side"><div class="cx-key"><span class="id b">B</span>'
          + '<span class="src">' + esc(c.source_b) + '</span></div>'
          + '<div class="cx-claim" style="color:#F0F0F0">' + esc(c.claim_b) + '</div></div>'
      + '</div>'
      + '<div class="cx-res" style="border-left-color:' + col + '">'

        + (c.matters_because ? '<div class="w">' + esc(c.matters_because) + '</div>' : '')
      + '</div></div>';

    + (rows || '<div class="empty-box">' + esc(emptyMsg()) + '</div>') + '</div>';
}

/* ================================================================ WINBACK */
function vWinback(){

      + '<div class="wb-head">'
        + '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">'
          + '<span class="wb-name" data-acc="' + esc(w.account_id) + '">' + esc(w.name) + '</span>'
          + '<span class="band" style="font-size:10px;letter-spacing:.14em;padding:3px 9px;color:' + v[0]
            + ';background:' + v[1] + ';border:1px solid ' + v[2] + '">' + esc(v[3]) + '</span></div>'
        + '<div class="wb-stats">'
          + '<div style="text-align:right"><div class="wb-k">Lost</div>'
            + '<div class="wb-v">' + money(w.lost_arr) + '</div></div>'
          + '<div style="width:110px"><div class="wb-k">Worth chasing</div>'
            + '<div class="meter" style="margin-top:9px"><i style="width:' + clamp(w.score)
            + '%;background:' + sc + '"></i></div></div>'
        + '</div></div>'
      + '<div class="wb-cols">'
        + '<div class="wb-side a"><div class="wb-lab">Why they left</div>'
          + '<div style="display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap">'
            + '<span class="chip">' + esc(w.cause_category) + '</span>'
            + '<span style="font:400 12px/1.5 var(--sans);color:'
              + (w.reversible ? "#72A899" : "#F0768D") + '">'
            + (w.reversible ? "the cause can be fixed" : "the cause cannot be fixed") + '</span></div>'
          + '<div class="wb-txt">' + (cause ? esc(cause)
              : '<span style="color:#999999">' + esc(emptyMsg()) + '</span>') + '</div>'
          + (clean(w.what_changed_since)
              ? '<div class="wb-lab" style="margin-top:20px">What has changed since</div>'
                + '<div class="wb-txt">' + esc(clean(w.what_changed_since)) + '</div>' : '')
        + '</div>'
        + '<div class="wb-side"><div class="wb-lab">The verdict</div>'
          + '<div class="wb-txt">' + (reason ? esc(reason)
              : '<span style="color:#999999">' + esc(emptyMsg()) + '</span>') + '</div>'
          + (clean(w.residual_relationship)
              ? '<div class="wb-dim">' + esc(clean(w.residual_relationship)) + '</div>' : '')
          + (clean(w.first_move)
              ? '<div class="callout"><div class="k">First move</div>'
                + '<div class="v hd">' + esc(clean(w.first_move)) + '</div></div>' : '')
        + '</div>'
      + '</div></div>';
  }).join("");

  return degradedBanner() + '<div class="stack">'
    + (rows || '<div class="empty-box">No churned accounts in state yet.</div>') + '</div>';
}

      + '<td class="r" style="padding:13px 16px;font:500 13px/1.4 var(--mono);white-space:nowrap;color:'

/* =================================================================== FEED */
function vFeed(){
  var sys = PF.system || {}, wd = sys.withdrawn_objects || [], ls = sys.last_sync || {};
  var tiles = [
    ["Checks run", String((PF.syncs || []).length), "#F0F0F0", "most recent " + stamp(ls.started_at)],
    ["Documents withdrawn", String(wd.length), wd.length ? "#F43F5E" : "#999999",
      "source files that were there last time and are gone now"],
    ["Things we changed our mind about", String((PF.belief_deltas || []).length), "#F0F0F0",
      "each one traced to the change that caused it"],
    ["Checks every", "60s", "#F0F0F0", "runs on its own, nobody presses a button"]
  ];
  var beliefs = (PF.belief_deltas || []).map(function(b){
    return '<div class="belief"><div class="st">' + esc(stamp(b.occurred_at)) + '</div><div>'
      + '<div class="hd"><span class="acc">' + esc(b.account_id) + '</span>'
      + '<span class="fl">' + esc(b.field) + '</span>'
      + '<span class="ov">' + esc(scalar(b.old_value)) + '</span>'
      + '<span class="nv">' + esc(scalar(b.new_value)) + '</span></div>'
      + (b.narrative ? '<div class="nr">' + esc(b.narrative) + '</div>' : '') + '</div></div>';
  }).join("");
  var changes = (PF.change_feed || []).slice(0, 30).map(function(c){
    return '<div class="feed-row"><span class="feed-ct" style="color:'
      + (CT[c.change_type] || "#999999") + '">' + esc(c.change_type) + '</span>'
      + '<span class="feed-st">' + esc(stamp(c.detected_at)) + '</span>'
      + '<span class="feed-lb">' + esc(c.title || c.source_id) + '</span></div>';
  }).join("");
  var syncs = (PF.syncs || []).map(function(s){
    return '<tr><td>' + esc(s.id) + '</td>'
      + '<td style="white-space:nowrap">' + esc(stamp(s.started_at)) + '</td>'
      + '<td style="font-family:var(--sans)">' + esc(s.trigger) + '</td>'
      + '<td class="r" style="color:#D6D6D6">' + esc(s.objects_seen) + '</td>'
      + '<td class="r">' + esc(s.added) + '</td><td class="r">' + esc(s.modified) + '</td>'
      + '<td class="r" style="font-weight:500;color:' + (s.withdrawn ? "#F43F5E" : "#999999") + '">'
        + esc(s.withdrawn) + '</td>'
      + '<td style="font-family:var(--sans);color:' + (s.status === "ok" ? "#72A899" : "#F43F5E") + '">'
        + esc(s.status) + '</td></tr>';
  }).join("");

  return degradedBanner()
    + '<div class="tiles">' + tiles.map(function(t){
        return '<div class="tile"><div class="tile-lab">' + esc(t[0]) + '</div>'
          + '<div class="tile-val" style="color:' + t[2] + '">' + esc(t[1]) + '</div>'
          + '<div class="tile-note">' + esc(t[3]) + '</div></div>';
      }).join("") + '</div>'
    + (wd.length
        ? '<div class="wd-box"><div class="wd-head"><div class="t">Withdrawn from the source</div>'
          + '<div class="b">These documents existed at the last check and are gone now. They have been '
          + 'dropped from everything on this page and kept only for the record. If a claim rested on one '
          + 'of them, it no longer stands.</div></div>'
          + wd.map(function(w){
              return '<div class="wd-row"><span class="k">WITHDRAWN</span>'
                + '<span class="o">' + esc(w.obj_key) + '</span>'
                + '<span class="s">' + esc(w.account_id || "portfolio-wide") + '</span>'
                + '<span class="st">' + esc(stamp(w.withdrawn_at)) + '</span></div>';
            }).join("") + '</div>'
        : '')
    + '<div class="subhead"><h2>What we changed our mind about</h2></div>'
    + (beliefs || '<div class="empty">No belief changes yet. The first full pass sets the baseline.</div>')
    + '<div class="subhead"><h2>Source changes picked up</h2>'
      + '<span style="font:400 10px/1 var(--mono);color:#999999;letter-spacing:.1em">'
      + Math.min(30, (PF.change_feed || []).length) + ' of ' + (PF.change_feed || []).length
      + ' shown</span></div>'
    + '<div class="scrollbox">' + (changes || '<div class="empty">Nothing yet.</div>') + '</div>'
    + '<div class="subhead"><h2>Every check it has run</h2></div>'
    + '<div style="overflow-x:auto"><table class="plain"><thead><tr>'
    + '<th>Run</th><th>Started</th><th>Trigger</th><th class="r">Files checked</th><th class="r">New</th>'
    + '<th class="r">Changed</th><th class="r">Withdrawn</th><th>Result</th>'
    + '</tr></thead><tbody>' + syncs + '</tbody></table></div>';
}

/* ======================================================== ACCOUNT (drill) */
function renderAccount(id){
  if (CACHE[id]) return paintAccount(CACHE[id]);
  $("#app").innerHTML = '<button class="back" data-back="1">← Back</button>'
    + '<div class="empty">Loading account…</div>';
  fetch("accounts/" + encodeURIComponent(id) + ".json?t=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(s){
      CACHE[id] = s;
      if (ACC === id){ paintAccount(s); renderHead(); }
    })
    .catch(function(){
      if (ACC !== id) return;
      $("#app").innerHTML = '<button class="back" data-back="1">← Back</button>'
        + '<div class="empty-box">No detail file has been published for '
        + '<span style="font-family:var(--mono)">' + esc(id) + '</span> yet.</div>';
    });
}

function paintAccount(s){
  var sy = s.synthesis || {}, g = s.reality_gap || {}, h = s.health || {};
  var u = (s.usage && s.usage.flightHours) || {}, r = s.renewal || {};
  var one = clean(sy.one_line), situation = clean(sy.situation);

  var facs = (h.factors || []).map(function(f){
    var col = f.quality > .7 ? "#3A7A65" : f.quality > .45 ? "#D9A441" : "#F43F5E";
    return '<div class="fac"><div><div class="k">' + esc(String(f.factor).replace(/_/g, " ")) + '</div>'
      + '<div class="w">weight ' + esc(f.weight) + '</div></div>'
      + '<div><div class="rs">' + esc(f.reason) + '</div>'
      + '<div class="meter" style="margin-top:8px"><i style="width:'
        + clamp((f.quality || 0) * 100) + '%;background:' + col + '"></i></div></div>'
      + '<div class="lost" style="color:' + (f.points_lost > 8 ? "#F0768D" : "#999999") + '">−'
        + esc(Math.round(f.points_lost)) + '</div></div>';
  }).join("");

  var gapBanner = "";
  if (g.direction === "overstated"){
    gapBanner = '<div class="banner b-err" style="margin-top:22px"><span class="tag">REALITY GAP</span>'
      + '<div><div class="t">The record is more optimistic than the evidence supports.</div>'
      + '<div class="b">' + esc(g.note) + '</div></div></div>';
  } else if (g.note){
    var up = g.direction === "understated";
    gapBanner = '<div class="banner" style="margin-top:22px;border:1px solid '
      + (up ? "#2B5A4A" : "#2E2E2E") + ';border-left:3px solid ' + (up ? "#3A7A65" : "#3D3D3D")
      + ';background:' + (up ? "#16211D" : "#1E1E1E") + '">'
      + '<span class="tag" style="color:' + (up ? "#8FC9B4" : "#999999") + '">'
      + (up ? "UNDERSTATED" : "AGREES") + '</span>'
      + '<div><div class="b" style="margin-top:0">' + esc(g.note) + '</div></div></div>';
  }

  var usagePanel = (s.usage && s.usage.has_usage)
    ? '<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">'
      + spark(u.values, 220, 54)
      + '<div><div class="big">' + esc(u.latest) + '</div>'
      + '<div class="tile-note">flight hours in ' + esc((u.months || []).slice(-1)[0] || "") + '</div></div></div>'
      + '<div class="say" style="margin-top:14px">' + esc(u.headline || "") + '</div>'
      + '<div class="sub" style="margin-top:9px">trajectory ' + esc(u.trajectory) + ' · 3 vs 3 '
        + esc(pct(u.pct_3v3)) + ' · peak ' + esc(u.peak) + ' in ' + esc(u.peak_month)
        + ((s.usage.missions && s.usage.missions.latest != null)
            ? ' · missions latest ' + esc(s.usage.missions.latest) : '') + '</div>'
    : '<div class="empty" style="padding:0">No usage telemetry for this account. For a pre-sale or '
      + 'non-flying account that is expected, not a red flag.</div>';

  var renewPanel = '<div class="dl">'
    + '<dt>Date</dt><dd>' + (r.date
        ? esc(r.date) + ' · ' + esc(days(r.days_to_renewal, false))
        : '<span style="color:#999999">not stated anywhere in the source material</span>') + '</dd>'
    + '<dt>Bucket</dt><dd>' + pill(r.bucket) + '</dd>'
    + (r.probability != null
        ? '<dt>Probability</dt><dd>' + Math.round(r.probability * 100) + '%</dd>' : '')
    + '<dt>Basis</dt><dd style="color:#999999">' + esc(r.basis || "—") + '</dd></div>'
    + (r.source ? '<div class="quotes"><div class="quote"><div class="t">“'
        + esc(r.source.quote || "") + '”</div><div class="s">'
        + esc(r.source.doc || "") + '</div></div></div>' : '');

  var actions = (s.actions || []).map(function(a, i){
    return '<div class="act">'
      + '<div style="font:500 15px/1 var(--mono);color:#999999">' + String(i + 1).padStart(2, "0") + '</div>'
      + '<div style="padding-right:28px;min-width:0">'
        + '<div class="xtitle" style="font-size:15px">' + esc(a.action) + '</div>'
        + (a.target_person ? '<div class="sub">→ ' + esc(a.target_person) + '</div>' : '')
        + '<div class="qwhy">' + esc(a.why_now) + '</div>' + quotes(a.evidence_quotes) + '</div>'
      + '<div class="qmeta" style="gap:7px">' + metaRow("Owner", a.owner_function || "—", null, true)
        + metaRow("Effort", a.effort) + metaRow("Value", a.value_score) + '</div></div>';
  }).join("");

  var risks = (sy.top_risks || []).map(function(x){
    return '<div class="risk">'
      + pill(x.severity === "critical" ? "Critical" : x.severity === "high" ? "At Risk" : "Watch")
      + '<div class="t">' + esc(x.risk) + '</div>'
      + '<div class="w">' + esc(x.why_it_matters) + '</div>' + quotes(x.evidence_quotes) + '</div>';
  }).join("");

  var opps = (sy.opportunities || []).map(function(o){
    return '<div class="risk">'
      + '<span class="band" style="color:' + (o.is_trap ? "#F0768D" : "#8FC9B4") + ';background:'
        + (o.is_trap ? "#271219" : "#16211D") + ';border:1px solid '
        + (o.is_trap ? "#58202F" : "#2B5A4A") + '">'
        + (o.is_trap ? "TRAP" : esc(o.confidence)) + '</span>'
      + '<div class="t">' + esc(o.opportunity) + '</div>'
      + (o.is_trap && o.trap_reason ? '<div class="w" style="color:#F0768D">' + esc(o.trap_reason) + '</div>' : '')
      + (o.unblock_condition ? '<div class="w">Unblock: ' + esc(o.unblock_condition) + '</div>' : '')
      + (o.estimated_value_basis ? '<div class="sub">' + esc(o.estimated_value_basis) + '</div>' : '')
      + quotes(o.evidence_quotes) + '</div>';
  }).join("");

  var people = (s.people || []).map(function(p){
    return '<tr><td><div class="nm" style="white-space:normal">' + esc(p.name) + '</div>'
      + (p.quotes || []).slice(0, 1).map(function(q){
          return '<div class="quotes" style="margin-top:8px"><div class="quote"><div class="t">“'
            + esc(q.quote) + '”</div></div></div>';
        }).join("")
      + '</td><td class="say">' + esc(p.title || "—") + '</td>'
      + '<td><span class="chip">' + esc(p.role) + '</span></td>'
      + '<td class="say" style="color:#999999">' + esc(p.org_side) + '</td>'
      + '<td class="say">' + esc(p.sentiment) + '</td>'
      + '<td class="say"' + (p.status !== "active" ? ' style="color:#F0768D"' : '') + '>'
        + esc(p.status) + '</td>'
      + '<td class="sub" style="margin:0">' + esc((p.documents || []).join(", ")) + '</td></tr>';
  }).join("");

  var contra = (sy.contradictions || []).map(function(c){
    return '<div class="risk"><div class="nm2">' + esc(c.topic) + '</div>'
      + '<div class="quotes" style="max-width:none">'
      + '<div class="quote"><div class="t"><b>' + esc(c.source_a) + ':</b> ' + esc(c.claim_a) + '</div></div>'
      + '<div class="quote"><div class="t"><b>' + esc(c.source_b) + ':</b> ' + esc(c.claim_b) + '</div></div></div>'
      + '<div class="w" style="color:#D95B28">Resolution: ' + esc(c.resolution) + '</div>'
      + (c.matters_because ? '<div class="w">' + esc(c.matters_because) + '</div>' : '') + '</div>';
  }).join("");

  var commits = (s.open_commitments || []).map(function(c){
    return '<tr><td style="white-space:nowrap"><span class="chip">' + esc(c.owner_side) + '</span> '
      + '<span class="say">' + esc(c.owner || "") + '</span></td>'
      + '<td><div class="say">' + esc(c.promise) + '</div>'
      + (c.quote ? '<div class="quotes"><div class="quote"><div class="t">“'
          + esc(c.quote) + '”</div></div></div>' : '') + '</td>'
      + '<td class="sub" style="margin:0">' + esc(c.doc || "")
      + (c.due ? ' · due ' + esc(c.due) : '') + '</td></tr>';
  }).join("");

  var docs = (s.documents || []).map(function(d){
    var sum = clean(d.summary);
    return '<tr><td><div class="nm" style="white-space:normal">' + esc(d.title) + '</div>'
      + '<div class="sub">' + esc(d.file) + '</div></td>'
      + '<td><span class="chip">' + esc(d.type) + '</span></td>'
      + '<td class="mono" style="white-space:nowrap">' + esc(d.date || "undated") + '</td>'
      + '<td class="mono">' + esc(d.date_basis)
        + (d.date_text ? ' · “' + esc(d.date_text) + '”' : '') + '</td>'
      + '<td class="say" style="color:#999999">' + (sum ? esc(sum) : "—") + '</td></tr>';
  }).join("");

  var deltas = (s._deltas || []).map(function(d){
    return '<div class="belief"><div class="st">' + esc(stamp(d.occurred_at)) + '</div><div>'
      + '<div class="hd"><span class="fl">' + esc(d.field) + '</span>'
      + '<span class="ov">' + esc(scalar(d.old_value)) + '</span>'
      + '<span class="nv">' + esc(scalar(d.new_value)) + '</span></div>'
      + (d.narrative ? '<div class="nr">' + esc(d.narrative) + '</div>' : '') + '</div></div>';
  }).join("");

  $("#app").innerHTML = '<button class="back" data-back="1">← Back</button>'
    + '<div class="a-tags">'
      + pill(h.band + " " + Math.round(h.score), "font-size:11px;letter-spacing:.1em;padding:3px 9px;")
      + '<span class="chip">' + esc(s.lifecycle) + '</span>'
      + '<span class="chip">' + money(s.arr) + ' ARR</span>'
      + (s.tier ? '<span class="chip">' + esc(s.tier) + '</span>' : '')
      + (s.vertical ? '<span class="chip">' + esc(s.vertical) + '</span>' : '')
      + '<span class="chip">CRM says ' + esc(s.crm_health || "—") + '</span>'
    + '</div>'
    + (one ? '<p class="a-one">' + esc(one) + '</p>' : '')
    + gapBanner
    + '<div class="a-cols">'
      + '<div class="panel"><div class="panel-head"><span class="t">Why this health score</span>'
        + '<span class="c">' + esc(Math.round(h.score)) + ' / 100</span></div>'
        + '<div class="panel-body">'
        + (facs || '<div class="empty" style="padding:0">No factors recorded.</div>')
        + '<div class="sub" style="margin-top:14px">Weighted sum of five factors. Every point lost is '
        + 'attributable to a named factor and a stated reason.</div></div></div>'
      + '<div class="panel"><div class="panel-head"><span class="t">Flight activity</span></div>'
        + '<div class="panel-body">' + usagePanel + '</div>'
        + '<div class="panel-head" style="border-top:1px solid var(--bd2)"><span class="t">Renewal</span></div>'
        + '<div class="panel-body">' + renewPanel + '</div></div>'
    + '</div>'
    + '<div class="subhead"><h2>The situation</h2></div>'
    + (situation
        ? '<p class="say" style="max-width:820px;margin:16px 0 0;font-size:14px;line-height:1.65">'
          + esc(situation) + '</p>'
        : '<div class="empty">' + esc(emptyMsg()) + '</div>')
    + '<div class="sub" style="margin-top:12px">sentiment ' + esc(sy.sentiment_label || "—")
      + ' and ' + esc(sy.sentiment_trend || "—") + ' · champion '
      + esc(sy.champion_status || "—") + ' · economic buyer '
      + (sy.economic_buyer_identified ? "identified" : "not identified")
      + (sy.competitor_present
          ? ' · competitor present: ' + esc((sy.competitor_names || []).join(", ")) : '')
      + (s.days_silent != null ? ' · last dated contact ' + esc(s.days_silent) + ' days ago' : '')
    + '</div>'
    + '<div class="subhead"><h2>Do this next</h2></div>'
    + (actions || '<div class="empty">' + esc(emptyMsg()) + '</div>')
    + '<div class="a-cols">'
      + '<div class="panel"><div class="panel-head"><span class="t">Risks</span>'
        + '<span class="c">' + (sy.top_risks || []).length + '</span></div><div class="panel-body">'
        + (risks || '<div class="empty" style="padding:0">' + esc(emptyMsg()) + '</div>') + '</div></div>'
      + '<div class="panel"><div class="panel-head"><span class="t">Opportunities</span>'
        + '<span class="c">' + (sy.opportunities || []).length + '</span></div><div class="panel-body">'
        + (opps || '<div class="empty" style="padding:0">' + esc(emptyMsg()) + '</div>') + '</div></div>'
    + '</div>'
    + '<div class="subhead"><h2>Who matters here</h2>'
      + '<span style="font:400 10px/1 var(--mono);color:#999999;letter-spacing:.1em">'
      + (s.people || []).length + '</span></div>'
    + (people
        ? '<div class="tblwrap" style="margin-top:16px"><table class="t"><thead><tr>'
          + '<th>Person</th><th>Title</th><th>Role</th><th>Side</th><th>Sentiment</th><th>Status</th>'
          + '<th>Seen in</th></tr></thead><tbody>' + people + '</tbody></table></div>'
        : '<div class="empty">' + esc(emptyMsg()) + '</div>')
    + (contra
        ? '<div class="subhead"><h2>Where the sources disagree</h2></div>'
          + '<div class="panel" style="margin-top:16px"><div class="panel-body">' + contra + '</div></div>' : '')
    + (commits
        ? '<div class="subhead"><h2>Open commitments</h2></div>'
          + '<div class="tblwrap" style="margin-top:16px"><table class="t"><tbody>'
          + commits + '</tbody></table></div>' : '')
    + '<div class="subhead"><h2>Source documents</h2>'
      + '<span style="font:400 10px/1 var(--mono);color:#999999;letter-spacing:.1em">'
      + esc(s._evidence_count || 0) + ' EVIDENCE UNITS</span></div>'
    + '<div class="tblwrap" style="margin-top:16px"><table class="t"><thead><tr>'
      + '<th>Document</th><th>Type</th><th>Date</th><th>How dated</th><th>What it says</th>'
      + '</tr></thead><tbody>' + docs + '</tbody></table></div>'
    + '<div class="empty" style="padding-top:14px">Documents withdrawn from the source are excluded here '
      + 'and shown on the Change Feed.</div>'
    + (deltas ? '<div class="subhead"><h2>How our understanding has changed</h2></div>' + deltas : '');
}

/* ================================================================= render */
function render(){
  renderNav();
  renderHead();
  if (ACC) return renderAccount(ACC);
  if (!PF){
    $("#app").innerHTML = '<div class="empty-box">Could not load '
      + '<span style="font-family:var(--mono)">portfolio.json</span>.<br>'
      + 'The daemon has not published state yet. This page retries every 30 seconds.</div>';
    return;
  }
  var fn = {triage:vTriage, accounts:vAccounts, renewals:vRenewals, expansion:vExpansion,
            gaps:vGaps, contradictions:vContra, winback:vWinback, flight:vFlight, feed:vFeed}[VIEW];
  $("#app").innerHTML = fn ? fn() : "";
}

/* ----------------------------------------------------------- interactions */
document.addEventListener("click", function(e){
  var nav = e.target.closest("[data-go]");
  if (nav){ go(nav.getAttribute("data-go")); return; }
  var back = e.target.closest("[data-back]");
  if (back){ if (history.length > 1) history.back(); else go(VIEW); return; }
  var acc = e.target.closest("[data-acc]");
  if (acc){ openAcc(acc.getAttribute("data-acc")); return; }
});
window.addEventListener("hashchange", function(){
  parseHash();
  render();
  window.scrollTo(0, 0);
});

/* ------------------------------------------------------------- data layer */
function loadPortfolio(silent){
  return fetch("portfolio.json?t=" + Date.now(), {cache:"no-store"})
    .then(function(res){ if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function(data){
      var changed = !PF || PF.generated_at !== data.generated_at;
      PF = data;
      FAILED = false;
      if (changed){ CACHE = {}; render(); }
      tickLive();
    })
    .catch(function(){
      FAILED = true;
      if (!silent){ PF = null; render(); }
      tickLive();
    });
}

parseHash();
renderNav();
renderHead();
tickLive();
loadPortfolio(false);
setInterval(function(){ loadPortfolio(true); }, 30000);
</script>
</body>
</html>
