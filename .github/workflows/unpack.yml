name: unpack bootstrap
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source bundle
        run: |
          if [ ! -f bootstrap.tar.gz ]; then echo 'nothing to unpack'; exit 0; fi
          mkdir -p /tmp/bs && tar xzf bootstrap.tar.gz -C /tmp/bs
          rm -rf /tmp/bs/.github
          cp -r /tmp/bs/. .
          rm -f bootstrap.tar.gz
          ls -R tower web
      - name: Commit extracted source
        run: |
          git config user.name 'tower-bootstrap'
          git config user.email 'tower-bootstrap@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'unpack source bundle'
          git push